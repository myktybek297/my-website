га же жумушуңузга терс таасир тийгизиши мүмкүн. Экинчи үзүндү жаңы ой же чечим айтпайт, мурдагы ойду башка сөз менен кайталайт, ошондуктан бул «окшош ой».","x":["Бул вариант да жакын көрүнөт (мисал катары), бирок 84-88-сап жаңы факт келтирбейт, ошол эле ойду кайталайт.","84-88-сапта көйгөйдү чечүүнүн жолу берилген эмес, коркунуч эскертилет.","","Бул себеп-натыйжа эмес: эки үзүндү тең бирдей коркунучту эскертет."],"i":"А («далил») да талашка түшөт. Ачкыч В, анткени 84-88-сап жаңы ой кошпой, мурдагыны кайталайт."},{"q":"1-4-саптарда айтылган маалыматтар менен 38-42-сапта айтылган маалыматтардын катышы - бул ...","o":["ой жана аны төгүндөө","себеп жана анын натыйжасы","ой жана аны негиздөө","көйгөй жана аны чечүү"],"k":3,"e":"1-4-саптарда көйгөй коюлган: интернетте жеке маалыматты коргоо олуттуу маселеге айланды. 38-42-саптарда ошол көйгөйгө чара айтылат: өнүккөн өлкөлөрдө укук коргоо бөлүмдөрү мыйзам бузгандардын аккаунттарын жана ар бир пикирин текшерет.","x":["Экинчи үзүндү биринчи ойду жокко чыгарбайт, ага жооп берет.","Биринчиси себеп, экинчиси натыйжа эмес: биринчиси көйгөй, экинчиси ага каршы чара.","38-42-сап биринчи ойду негиздеп жаткан жок, чара көрүү жөнүндө айтат.",""]},{"q":"25-саптагы «мүдөөсүн» деген сөз аркылуу автор эмнени айткысы келген?","o":["ой-тилектерин","келечек пландарын","пайдалуу иш-аракеттерин","арам ойлорун"],"k":3,"e":"25-саптагы «мүдөөсүн ишке ашыра баштайт» деген сөздөр 20-29-саптарда сүрөттөлгөн шылуундарга тиешелүү: алар маалымат топтоп, андан кийин «кара ниет максатын» (17-18-сап) ишке ашырат. Ошондуктан «мүдөө» бул жерде арам ой.","x":["Ой-тилек жалпы сөз, бирок контекстте шылуундар жөнүндө сөз болуп жатат, алардын ойлору арам.","Келечек пландары жөнүндө эч нерсе айтылган эмес.","Бул адамдар пайдалуу эмес, зыяндуу иш жасайт.",""]},{"q":"114-117-сапта айтылгандардын мазмуну 118-122-сапта айтылгандарга карата эмне болот?","o":["маселени чечүү","ойду жыйынтыктоо","тезисти далилдөө","ойду улантуу"],"k":0,"e":"114-117-саптарда сунуш: коом шыкпаңыз.","","Бул бир гана мисал, негизги ой эмес.","Автор андай болуунун себептерин көрсөтпөйт, андан сактанууга чакырат."]},{"q":"46-57 саптарда туюнтулган башкы ой кайсы?","o":["Башка бирөөнүн сүрөтүн же видеосун уруксат сурабай жарыялабоо керек,","Интернет айдыңында коркунучтар көп,","Интернетке бир нерсе чыгарардан мурун жети өлчөп, бир кескен оң.","Интернетке чыгарылган маалымат маалыматтык топтомдо сакталып кала берет."],"k":2,"e":"46-57-саптар «Андыктан...» деген сөз менен жыйынтыкталат: «бир нерсе чыгарардан мурун жети өлчөп, бир кескен оң». Бул абзацтын башкы ою. Калган сүйлөмдөр ушул кеңештин себептерин түшүндүрөт.","x":["Бул бир гана кошумча эскертүү (мисал), жалпы ой эмес.","Абзацта «коркунучтар көп» деп жалпы айтылбайт, баары бир кеңешке алып барат.","","Бул кеңештин себеби, ал эми башкы ой — кеңештин өзү."]},{"q":"Автор текст аркылуу эмнени айткысы келген?","o":["Паспорт, ID, айдоочулук күбөлүк, банктык карточка ж.б. жеке маалыматтарды интернеттен бөлүшпөөгө кеңеш берүүдө.","Ой-пикир калтырууда ачууга алдырбоону сунуш кылууда.","Убакытты интернетке коромжу кылбай, үнөмдүү пайдаланууга чакырык таштоодо,","Интернетте жеке маалыматтарды коопсуз сактоонун жолдорун сунуштап, бул коопсуздукка ар бир жаран өзү жооптуу экендигин эскертүүдө."],"k":3,"e":"Бүтүн текст жеке маалыматты коргоонун жолдорун санап берет (браузер тандоо, тиркемелерди текшерүү, шектүү каттарды ачпоо ж.б.). 43-45-саптарда автор: «ар бир интернет колдонуучу өзүнө өзү сак болуусу зарыл» деп жыйынтыктайт.","x":["Бул бир гана кеңеш (26-29-сап), тексттин бүтүн ою эмес.","Ачууга алдырбоо — бир гана сунуш (82-83-сап).","Убакытты туура пайдалануу акыркы сүйлөмдөрдө гана айтылат, тексттин негизги темасы эмес.",""]},{"q":"123-126-саптарда айтылган ойдон улам автордун кандай эмоциясын байкоого болот?","o":["кыжырдануусун","капалануусун","кайдыгерлигин","үмүт артуусун"],"k":3,"e":"123-126-саптарда автор: «гаджеттин кулу болбошуңузга терең ишенем» деп жазат. «Терең ишенем» окурманга үмүт артууну билдирет.","x":["Кыжырдануу жок, автор тынч жана кеңеш берет.","Капалануу эмес, ишеним билдирилет.","Кайдыгер адам «терең ишенем» деп айтпайт, автор окурманга кам көрөт.",""]},{"q":"Текстте интернеттеги маалымат коопсуздугунун кандай эрежелери тууралуу айтылды?\nI. Жеке маалыматтарды жарыялабоо.\nII. Текшерилбеген маалыматтарды бөлүшпөө.\nІІІ. Эч кандай пикир, комментарий жазбоо.\nIV. Достук сунуштарын четке какпоо.\nV. Бекер акцияларга, лотереяларга катышпоо.","o":["I, IV","IV, V","I, II, V","III, IV, V"],"k":2,"e":"Текстте үч эреже бар: жеке маалыматты (паспорт, ID ж.б.) бөлүшпөө, I (26-29-сап); текшерилбеген маалыматты бөлүшпөө, II (59-61-сап); «бекер» акцияларга жана лотереяларга алданбоо, V (95-104-сап). III жана IV тексттин ойуна карама-каршы: автор пикир жазууга тыюу салбайт, ачууга алдырбоону гана сунуштайт (82-83-сап), ал эми достук сунушун текшермейинче кабыл албоо керек дейт (90-93-сап), «четке какпоо» дегенди айтпайт.","x":["IV туура эмес: текст достук сунушун текшермейинче кабыл албоо керек дейт.","IV туура эмес жана I, II да кошулушу керек эле.","","III жана IV экөө тең тексттин ойуна карама-каршы."]}]},{"title":"Виртуалдык чындык","source":"Интернет материалдары боюнча","label":null,"intro":null,"passages":[{"label":"І үзүндү","source":null,"lines":[[0,"Сыягы, социалдык тармактардын эн"],[0,"активдүү колдонуучулары бетме-бет"],[0,"башкалардан аз баарлашары эбак эле"],[0,"кенири белгилүү болуп калган өндүү"],[5,"Кантсе да, окумуштуулар бул виртуалдык"],[0,"достукка ашыкча берилгендиктин жалгыз"],[0,"кошумча натыйжасы болбогондугуна"],[0,"ынанышты. Мындан да олуттуу кесепеттер"],[0,"бар. Ушул туурасында эң акыркы"],[10,"изилдөөлөрдүн бирин Дания илимий-"],[0,"изилдөө институтунун кызматкерлери"],[0,"жүргүзүштү. Ошол изилдөөгө 1095 киши"],[0,"катышты. Ыктыярдуу сыналуучулардын"],[0,"жарымы социалдык тармактарды"],[15,"пайдаланууну токтотушуп, андан 7 күн бою"],[0,"оолактап жүрүштү. Калгандары өз"],[0,"адаттарын өзгөртпөй, виртуалдык"],[0,"баарлашууну уланта дык дос табуу керек деген ой жок, тескерисинче, ашыкча виртуалдык достук зыяндуу."]},{"q":"Эмне үчүн Улуу Британияда өткөрүлгөн изилдөө текстте «кызык» деп аталган (95-сап)?","o":["Ошол изилдөөнүн корутундулары элдин кеңири катмары үчүн күтүлбөгөн жана кызыктуу болуп чыкты","Ар кандай жаш-курак топторундагы көп сандаган адамдар ошол изилдөөгө катышкан","Окумуштуулар ошол изилдөө менен олуттуу түрдө алпурушкан","Ошол изилдөө элди күлдүрүү үчүн жүргүзүлгөн"],"k":0,"e":"Британ изилдөөсүнүн жыйынтыктары күтүүсүз болгондуктан «кызык» деп аталат: 18% эртең менен тургандан эле телефонго асылат, 14% түн ортосунда ойгонуп текшерет, 18-24 жаштагылардын 46%ы смартфонун ар 15 мүнөт сайын иштетет, төрттөн бири смартфондон эмес, десерттен баш тартмак. «Ойлонгудай эле экен, чынбы?» (111) деген сөздөр ушуну тастыктайт.","x":["","Катышуучулардын саны жана курагы «кызык» деген сөздүн себеби эмес.","Изилдөө олуттуу, ал «кызык» деп жыйынтыгынын күтүүсүздүгү үчүн аталган.","Изилдөө элди күлдүрүү үчүн эмес, жыйынтыктары кызыктуу болгондуктан."]},{"q":"ІІ үзүндүдөгү маалымат боюнча, Улуу Британия окумуштуулары өз изилдөөсүнүн натыйжасында эмнени аныкташкан?","o":["Көпчүлүк адамдарга өз организминде топтолуп калган токсиндерди чыгаруу үчүн 7 сааттан 9 саатка чейин убакыт керек","Планшеттер нурлантып чыгарган көк жарык уктоого тоскоол болот","Смартфондорго болгон кез карандылык 18-24 жаштагы жаш адамдарда эң күчтүү","Жетиштүү убакыт уктабаган адамдарда олуггуу ден соолук көйгөлөрү болот"],"k":2,"e":"II үзүндүдө британ изилдөөсүнүн жыйынтыктары 95-111-саптарда: эртең менен 18%, түн ортосунда 14%, жатарда дээрлик 30% телефонго карайт, жаштардын (18-24) 46%ы ар 15 мүнөт сайын текшерет. Британ окумуштуулары аныктаган эң даана жыйынтык: смартфонго көз каранды болуу жаштарда эң күчтүү.","x":["7-9 саат уйку керек экенин америкалык профессор Дэн Сигел айтат (153-158), британ изилдөөсү эмес.","Көк жарык жөнүндө «адистер» түшүндүрөт (130-135), бул британ изилдөөсүнүн натыйжасы эмес.","","Уйкунун жети ирбөө, аналогдук телефон, жүзмө-жүз баарлашуу). II үзүндүдө да практикалык кеңеш бар: уйкуга артыкчылык берүү, жатардан мурун кеминде 1 саат смартфонсуз өткөрүү (166-170). Экөөндө тең окурманга иш жүзүндө колдонулуучу кеңеш берилет.","x":["Изилдөөлөргө таянуу экөөндө бар, бирок бул макала турмуш үчүн пайдалуу экенин көрсөтпөйт.","Сандарды келтирүү теманы тактайт, пайдалуулукту көрсөтпөйт.","Окшош тема — жалпы белги, пайдалуу кылуу ыкмасы эмес.",""]},{"q":"Кайсы суроонун жообу ІІ үзүндүдө гана камтылган?","o":["Смартфондор, планшеттер жана компьтерлер менен чеги жок алпурушуу уйкуга кандай таасир берет?","Виртуалдык жашоонун кесепетинен оолак болуу үчүн эмне кылыш керек?","Виртуалдык чындыкта жашоонун адам үчүн кандай натыйжалары бар?","Ар кандай өлкөлөрдөгү окумуштуулар электрондук байланыш каражатынын адамга тийгизген таасири боюнча кандай изилдөөлөрдү жүргүзүшкөн?"],"k":0,"e":"Уйкуга тийгизген таасир жөнүндө II үзүндүдө гана айтылат (130-165: көк жарык мелатонинди азайтат, 5 саат уйку жетишсиз). Калган суроолордун жообу эки үзүндүдө тең бар: кесепеттерден оолак болуу жолдору (I: 79-83, II: 166-170), виртуалдык чындыктын натыйжалары, ар кайсы өлкөлөрдөгү изилдөөлөр (I: Дания, Германия, Мичиган; II: Британия, Калифорния).","x":["","Жообу эки үзүндүдө тең бар (I: 79-83, II: 166-170).","Жообу эки үзүндүдө тең бар.","Изилдөөлөр эки үзүндүдө тең келтирилген."]}]},{"title":"Алгачкы маданият жана Саймалуу Таш","source":null,"label":null,"intro":null,"passages":[{"label":"1-үзүндү","source":"Текст К. Жусуповдун «Алгачкы маданият» деген макаласынан алынды","lines":[[0,"Кылымдан кылым санап, муундан-"],[0,"муунга мурас болуп уланып келе жаткан"],[0,"рухий маданияттын тамыры теренде. Ру-"],[0,"хий маданият алаканга аккан суудай чуу-"],[5,"руп түшүп турбайт. Ал тоо арасына ал-"],[0,"тын уюгандай, көл түбүнө жубар бермет"],[0,"тунгандай узак-узак кыйын мезгилди та-"],[0,"лап кылат. Маданиятка ошол мезгил обо-"],[0,"лу оңтой болуп жол ачса, ага шарт түзсө,"],[10,"эл анын камын к ыштуу мисал (97-103-саптар) эмнени далилдөө үчүн келтирилип жатат?","o":["Талаш-тартыштын «дал ортосун»","Окумуштуунун өз кесиптештерин жеңип чыгуусун","Эволюциялык концепциянын жеңишин","Жарылуулар жөнүндөгү теориянын таанылышын"],"k":0,"e":"83-95-саптарда: бири-бирине толук карама-каршы пикирлер тирешкенде акыйкат алардын дал ортосунда болушу мүмкүн. Мисал: биологияда Ламарк менен Кювье ондогон жыл талашкан, акыйкат алардын «дал ортосунда» экен, аны 1859-жылы Дарвин ачкан (97-103). Дарвин мисалы ушуну далилдейт.","x":["","Дарвин кесиптештерин жеңип чыккан эмес, акыйкатты тапкан.","Эволюциялык концепция жеңген эмес, Дарвин эки концепцияны бириктирген.","Жарылуу теориясы да жеңген эмес."]},{"q":"Автор «үзүрлүү талаш-тартыштын эн башкы каражаты» (104-107-саптар) деп эмнени атайт?","o":["Ар түрдүү ой-пикирлерди","Өз чындыгына болгон ишенимди","Аргументтердин жана контраргументтердин болушун","Аргументтердин сапаттуулугун текшерүүнү"],"k":2,"e":"104-107-саптарда: «үзүрлүү талаш-тартыштын эң башкы каражаты «макул» жана «каршы» пикирлерди аргументтөө болуп саналат». Башкача айтканда, аргументтер жана контраргументтер.","x":["Ар түрдүү ой-пикир талаштын башталышы, ал эми башкы каражат — аргументтөө.","Өз чындыгына ишенүү зыяндуу (47-50).","","Аргументтердин сапатын текшерүү кийинки кеңеш (133-137), эң башкы каражат эмес."]},{"q":"Автордун ой жүгүртүүсүнүн нугунда (113-132-carrap) акыркы сүйлөм алдыңкыларынын___ .","o":["себеби","шарты","түшүндүрмөсү","тыянагы"],"k":3,"e":"113-132-саптарда Жер жалпакпы же тоголокпу деген талаш: кеменин мачтасы алгач көрүнөт, андан кийин палуба жана корпус; Колумб деңизде сүзүп жерди айланып чыккан. Акыркы сүйлөм «Ошентип, практика бул талашты биздин планетанын шар сыяктуу экендигинин пайдасына чечти» — бул тыянак.","x":["Себеп эмес, натыйжа.","Шарт эмес, жыйынтык.","Түшүндүрмө эмес, корутунду.",""]},{"q":"Текст боюнча (141-148-саптар) Д. И. Менделеев үчүн маанилүү деп эсептелген нерсе -\nI жаңы илимий акыйкатты ким айткандыгын табуу\nII жаңы ойду өнүктүрүү\nIII илимде өзү жаңы акыйкатты орнотуу\nIV өз чындыгына башкаларды ынандыруу","o":["I, ІІ гана","II, IV гана","II, III гана","III, IV гана"],"k":2,"e":"141-148-саптарда Менделеев «илимий жаңы акыйкатты ким айткандыгын эмес, бул ойду ким өнүктүрүп, башкаларды ынандырып, жаңы акыйкатты илимге алып келип, анда орун-очок алдыргандыгын» маанилүү деп эсептеген. Ойду өнүктүрүү (II) жана жаңы акыйкатты илимде орнотуу (III) негизги. Ким биринчи айткандыгы (I) маанисиз.","x":["I туура эмес: Менделеев «ким айткандыгын эмес» дейт.","IV да текстте бар, бирок ачкыч боюнча II жана III тандалат.","","Ойду өнүктүрүү (II) жок, ал эми ал негизги шарттардын бири."],"w":"Текстте II, III, IV үчөө тең бар, ал эми варианттарда эки гана пункт берилген. Ачкыч «II, III» деп эсептейт, I эң так туура эмес пункт."},{"q":"Төмөндөгүлөрдүн кайсынысы автордун талаш-тартышка берген баасына жакыныраак?","o":["Турмуш чындыгы","Келишкис карама-каршылык","Акыйкатты табуу","Сөзсүз болуучу жамандык"],"k":2,"e":"Автор талашты пайдалуу деп эсептейт: «талаш керек жана ал пайдалуу» (168-169), анын жардамы менен илимде да, турмушта да жаңы акыйкат жаралат (170-172). Ошондуктан эң жакын баа: акыйкатты табуу.","x":["Турмуш чындыгы — башка маани.","Келишкис карама-каршылык талаштын өзүнүн абалы, ал эми автор аны акыйкатты табуу каражаты деп баалайт.","","Автор талашты жамандык эмес, пайда деп эсептейт."]},{"q":"Төмөндөгү пикирлердин кайсынысы талаш-тартыш жүргүзүү маданиятынын эрежелерине жооп БЕРБЕЙТ?","o":["«Макул» жана «каршы» пикирлерди аргументтөө","«Өз атынан» гана сүйлөо","Аргументтерди практикада текшерүү","Каршылаш тарапты анын көз карапшынын жаңылыштыгына ынандыруу"],"k":2,"e":"Суроо: кайсы пикир талаш маданиятынын эрежесине жооп БЕРБЕЙТ? 52-54-саптарда: «Өз атынан» гана сүйлөгөндө ким туура, ким туура эмес экенин жана акыйкат кайда экенин аныктоо мүмкүн эмес (Джек Лондондун «Деңиз көкжалы» мисалы). Демек, «өз атынан гана сүйлөө» талаш маданиятына карама-каршы.","x":["Бул — талаштын баш : 17 тиш сайылса, акула үстүнкү жаагындагы сырткы тиштердин 65%ын жана астынкы жаагындагы 70%ын бир эле мезгилде жоготкон болмок. Демек, окуя ойдон чыгарылган болушу толук ыктымал.","x":["Мегалодондун кол салуусу тастыкталган эмес.","Капитан карагай деп ойлогон (110-114), бирок биолог муну да ишенимсиз деп эсептейт.","Тиштер ак акуланын эң чоң тишинен чоң (103-106), ак акуланыкы эмес.",""]},{"q":"Эмне үчүн, текстке ылайык, окумуштуулар мегалодондун биздин убакта да бар деп эсептей алышпайт?","o":["Акулалар тереңдикте жашаган жаныбарлар эмес, алар 3,5 км-ден терен жерде жашай албайт","«Рашель Кохен» кемесинин түбүнөн табылган тиштердин чондугу мегалодондукуна туура келген эмес","Бул түрдүн аман калганы жөнүндө сез кылыш үчүн океанда килейген акулалардын жетиштүү саны учурабайт","Күбө болгондордун эч бири чоңдугу мегалодондукундай болгон акулага кезиккен эмес"],"k":2,"e":"153-156-саптарда: ири акулалар түр сакталып калгыдай санда бар болсо, бул сөзсүз байкоочулар тарабынан катталмак. Андыктан маселе эбак жабылган. Демек, түрдүн аман калганын айтууга килейген акулалардын жетиштүү саны жок.","x":["Тескерисинче, 3,5 км-ден терең жерде акулалар табылган (142-145), бирок алар мегалодонго окшобойт.","Тиштердин чоңдугу (8х10 см) мегалодондукуна туура келет.","","Күбөлөр бар, бирок алар ишенимсиз."]},{"q":"«Мегалодондун жок болуп кетиши жөнүндөгү маселе эбак эле жабылган» деген айтым (156-159-саптар) бул текстте эмнени билдирет?","o":["Окумуштуулар мегалодон жөнүндөгү маселени илим үчүн маанилүү деп эсептешпейт","Окумуштуулар мегалодон жашоо чөйрөсүн толугу менен алмаштырган деп эсептешет","Окумуштуулар мегалодондун табышмагы келечекте гана өз жандырмагын табат деп эсептешет","Окумуштуулар мегалодондун бүгүнкү дүйнөдө жашай албасынын жетиштүү далилдерине ээ"],"k":3,"e":"Акыркы абзацта автор: далилдин жоктугу — бир нерсенин жоктугунун далили эмес, бирок мегалодон бар болсо, аны сөзсүз байкоочулар каттамак. Ошондуктан акулаларды изилдөөчүлөр үчүн мегалодондун жок болуу маселеси ],"k":3,"e":"II үзүндүдө (89-93): «жакшы көргөн диваны көп жылга саламаттык берген эң мыкты тренажер; күндүзгү уйку эң мыкты «көнүгүү»». Тырмакчадагы сөз тамаша түрүндө айтылган: көнүгүү деп диванда эс алуу, күндүзгү уйку аталат.","x":["Спорт зал көнүгүүнүн тескериси катары айтылат (86-87).","Жарыш да көнүгүү эмес, башка жол алып келет.","Сейилдөө башка сүйлөмдө, анда жөө басуу жетиштүү (110-111).",""],"w":"Суроодо «84-сап» деп көрсөтүлгөн, бирок тырмакчадагы «көнүгүү» сөзү 92-сапта турат."},{"q":"П. Акст жазган китебинде эмнеге каршы чыгат?","o":["Убакытты бекер коротууга","Өз организмин зордоп иштетүүгө","Дегеле денеге күч келтирүүгө","Дене тарбия менен туруксуз машыгууга"],"k":1,"e":"100-104-саптарда: эч бир кубаныч алып келбеген иш менен алек болуу үчүн өздөрүн спорт залга күч менен сүйрөп барган кишилер өздөрүнө зыян гана келтиришет. Демек, автор өз организмин зордоп иштетүүгө каршы. Ал денеге күч келтирүүгө укук бар экенин жокко чыгарбайт (107-111).","x":["Автор убакытты бекер коротууга үгүттөйт (98-100), каршы эмес.","","Автор денеге күч келтирүүгө укук бар экенин мойнуна алат (107-111).","Туруксуз машыгуу жөнүндө текстте эч нерсе жок."]},{"q":"Эмне үчүн П. Акстын тыянактары текстте маанисиз деп аталган (94-сап)?","o":["Аларды башка адистер колдошпойт","Алар ДСУ эксперттеринин пикирине туура келбейт","Алар жалпы кабыл алынган пикирге каршы келет","Алардын эч кандай далили жок"],"k":2,"e":"94-95-саптарда: «Бир караганда маанисиз өңдөнгөн бул тыянак...». Профессор диван эң мыкты тренажер, жалкоолук пайдалуу дейт. Бул баарына белгилүү «спорт пайдалуу» деген жалпы пикирге каршы келет, ошондуктан алгач маанисиз көрүнөт.","x":["Тескерисинче, башка адистер макул (120-121).","ДСУ жөнүндө сөз 135-139-саптарда, ал профессорго каршы эмес.","","Далил бар: изилдөөлөр (114-117)."]},{"q":"Төмөндөгү айтымдардын кайсынысы ІІ үзүндүдөгү маалыматка дал келет?","o":["Дене көнүгүүлөрү бүт бардыгына пайдалуу","Дене көнүгүүлөрү стресстен жакшы коргойт","Денеге күч келтирүү ар бир а  болуусу тууралуу түшүнүк берүү"],"k":3,"e":"Текст чагылган кандай пайда болорун, булуттун ичинде эмне болорун, лидердин жана негизги разряддын өнүгүшүн түшүндүрөт, андан кийин шар түрүндөгү чагылганды баяндайт. Негизги максат — чагылгандардын пайда болуусу тууралуу түшүнүк берүү.","x":["Коопсуздук кеңештери (98-108) — кошумча бөлүк.","Франклин менен Араго — киришүү жана тарыхый маалымат.","Сырлар жөнүндө акыркы абзацта гана айтылат.",""]},{"q":"«Бирок ушул күнгө чейин чагылганда катылган сырлардын баарын ачуу мүмкүн болбой келет» деген сөздөр (4-7-саптар) эмнени түшүндүрөт?","o":["Чагылгандуу кара булуттун ичинде кандай кубулуштар болгонун окумуштуулар түшүндүрө албай жатканын","Окумуштуулар үчүн чагылгандын пайда болуусунун бардык процесстери аягына чейин түшүнүктүү эместигин","Чагылгандар өтө кооптуу болгондуктан аларды изилдөө мүмкүн эместигин","Шар түрүндөгү чагылган өтө сейрек кубулуш болуп саналганын"],"k":1,"e":"4-7-саптарда: Франклин чагылганды электр разряды деп аныктаган, бирок чагылганда катылган сырлардын баарын ачуу мүмкүн болбой келет. Бул — чагылгандын пайда болуу процесстеринин баары окумуштуулар үчүн толук түшүнүктүү эмес дегенди билдирет.","x":["Бул булуттун ичиндеги кубулуштар гана эмес, бардык процесстер жөнүндө.","","Изилдөө мүмкүн эмес эмес, баары ачыла элек.","Шар түрүндөгү чагылган 109-саптан кийин, 4-7-саптарда жалпы чагылган жөнүндө."]},{"q":"Чагылгандын өнүгүүсү эмнеден башталат?","o":["«Лидер» жердин бетине жетет (62-65-саптар)","Иондошкон канал менен заряддалган бөлүкчөлөр жөнөйт (65-71-саптар)","Булуттун кайсы бир жеринде иондордун ири концентрациясы пайда болот (38-45-саптар)","Өткөн ток жакынкы аймактарды ысытып, алардын иондошуусуна себеп болот (48-52-саптар)"],"k":2,"e":"38-41-саптарда: «Булуттун кайсы бир жеринде иондордун ири концентрациясынын пайда болуусу менен чагылгандын өнүгүүсү башталат».","x":["Лидер жерге жетүү — кийинки баскыч (62-65).","Заряддалган бөлүкчөлөр жөнөшү — акыркы, негизги баскыч (65-71).","","Өткөн ток аймак ш».","x":["Буунун жетишсиздиги жөнүндө эч нерсе айтылган эмес.","Атмосферанын үстүнкү катмарынын муздагы жөнүндө текст сөз кылбайт.","Музчалардын көлөмү эмес, көтөрүлүүчү агымдар жөнүндө.",""]},{"q":"Тексттеги маалыматка ылайык, француз физиги Аргонун салымы эмнеде?","o":["Ал чагылгандуу кара булутта ишке ашкан физикалык процесстерди сүрөттөп берген","Ал шар түрүндөгү чагылгандын пайда болуу механизмин чечмелеп берген","Ал лабораториялык шарттарда шар түрүндөгү чагылганды уюштура алган","Ал шар түрүндөгү чагылганга байкоо жүргүзүү менен байланыштуу фактыларды системалаштырган"],"k":3,"e":"112-116-саптарда: 19-кылымдын башында француз физиги Франсуа Араго шар түрүндөгү чагылган тууралуу фактыларды чогултуп, системалаштырууга аракет кылган. Анын салымы — байкоо фактыларын системалаштыруу.","x":["Кара булуттагы процесстерди ал сүрөттөгөн эмес.","Шардын пайда болуу механизми дагы түшүндүрүлө элек (116-117).","Лабораторияда шар чагылган алуу — бирөө да жакындай албаган маселе (157-159).",""]},{"q":"Текстке ылайык (98-108-саптар), чагылгандуу жаан учурунда эмне кылуу керек?","o":["Колотко чөк түшүп отуруу","Жалгыз турган бактын астына жашынуу","Качып кетүүгө аракет кылуу","Кыймылсыз туруу"],"k":0,"e":"103-108-саптарда: ачык жерде чагылгандуу жаанда калсаңар, качууга аракет кылбагыла, кайсы бир колотко чөк түшүп отургула жана нөшөр бүткөндөн кийин он чакты мүнөт күтө тургула.","x":["","Жалгыз турган бактын астына жашынуу «андан да кооптуу» (98-102).","Качууга аракет кылбагыла деп айтылат.","Кыймылсыз туруу — шар түрүндөгү чагылган жанында (147-150), кадимки чагылган учурунда эмес."]},{"q":"Тексттеги маалыматка ылайык, шар түрүндөгү чагылган кандай жагдайларда байкалган?","o":["Чагылгандуу кара булуттагы потенциалдардын айырмалуулугу пайда болгондо","Чагылгандуу жаан учурунда же андан кийин","Сейрек кышкы чагылгандуу жаан учурунда","Аба абдан иондошкон учурда"],"k":1,"e":"118-122-саптарда: шар түрүндөгү чагылгандын чагылгандуу жаан менен байланышы бар экени маалым; ал көбүн 1,"e":"Текстте ак калпак «кыргызды кыргыз кылып, башка элден айырмалап тааныткан Ала-Тоосу, Ысык-Көлү, боз үйү, комузу сыяктуу эле ата мурас энчиси» деп аталат (7-9-саптар). Автор аны «дөөлөттүү ыйык буюмубуз» (54-55-саптар) жана «элдин ыйык буюму» (90-сап) деп да атайт. Ошондуктан кыргыздар аны ата мурасы болгондуктан ыйык көрөт.","x":["Түндүккө окшоштук калпактын бычылышынын өзгөчөлүгү (10-13-саптар), бирок текст аны ыйык көргөндүн себеби катары көрсөтпөйт.","","Уздар тиккени калпактын даңазасына тиешелүү (39-45-саптар), ыйыктыктын себеби эмес.","Жарашыктуулугу айтылган (24-26-саптар), бирок ал сулуулукка тиешелүү, ыйык санаганга себеп болгон жок."]},{"q":"17-саптагы “төгөрөктүн төрт бурчу” деген туюнтма эмнени билдирет?","o":["Ак калпактын көрүнүшүн","Айлананын ичиндеги төрт бурчтукту","Бүтүндөй дүйнө жүзүн","Төрт бурчтуктун ичиндеги айлананы"],"k":2,"e":"15-18-саптарда: «төрт тарап алардын бириккен жери – уюл-чоку. Этек жагы да улам кеңейип, төгөрөктүн төрт бурчунун чексиздигинен кабар берип тургансыйт». «Төгөрөк» жер шары, «төрт бурч» ар тарап. Демек, туюнтма бүтүндөй дүйнө жүзүн билдирет, калпактын формасы ошого окшош.","x":["Калпактын көрүнүшү окшоштуруу катары айтылган, ал эми «төгөрөктүн төрт бурчу» дүйнөнүн өзүн билдирет.","Геометриялык фигура түз маанисинде алынган эмес, образдуу туюнтма.","","Бул түз геометриялык мааниде түшүнүү, ал эми текстте ал дүйнөнүн кеңдигинин образы."]},{"q":"Текст боюнча ак калпактын кадыр-баркынын төмөндөшүнүн башкы себеби эмнеде?","o":["Өтө көп чыгарылгандыгында","Белекке көп берилгендигинде","Баасынын арзандыгында","Ата салтынын унутулгандыгында"],"k":3,"e":"57-61-саптарда автор айыптоо менен жооп берет: «Албетте, биринчи кезекте өзүбүз, ... ата салтын, элдин наркын унуткан маңкурттугубуз». Башкы себеп ата салтынын унутулушу, калгандары анын көрүнүштөрү.","x":["Ашыкча чыгаруу (80-83-саптар) бар, бирок бул натыйжа жана чара катары айтылган, башкы себеп эмес.","Белекке бере берүү да айтылат (83-85-саптар), бирок автор аны ата салтын унутуунун натыйжасы катары көрсөтөт.","«Арзан, ашык баш буюм – барксыз буюм» (83-сап) натыйжа катары айтылган, баа төмөндөшү себеп эмес.",""]},{"q":"Тексттин 1-5-саптарындагы абзацтын контекстинде “Кыргыз баш кийимин ... өз уулунан башкага бербейт...” дегенди кандай мааниде түшүнүүгө болот?","o":["Баш кийимди ыйык туткандык","Уулунун урмат-сыйына умтулгандык","Буюмга ичи тардык кылгандык","Баш кийимден башка берер нерсеси жоктук"],"k":0,"e":"1-5-саптарда: баш кийимди кыргыз жерге таштабайт, өз уулунан башкага бербейт, белекке жолдобойт, 5 адам отурган отургучка да койбойт. Алардын баары баш кийимди ыйык тутканды көрсөтөт, 1-саптагы «эң ыйык буюмдардын бири» деген сөз да ушуну ырастайт.","x":["","Уулунун сый-урматы жөнүндө текстте сөз жок, ал баш кийимдин ыйыктыгына байланыштуу.","Ичи тардык эмес, ыйык буюмду коргоо жөнүндө сөз болууда.","Мындай ой текстте жок."]},{"q":"Төмөндөгү ырастоолордун кайсынысы берилген тексттин негизги максатын тагыраак аныктайт?","o":["Улуттук баш кийимдер тууралуу толук маалымат берүү","Элдик уздардын чеберчилигин даңазалоо","Ак калпакты чыгарууга тыюу салуу","Замандаштарды ата салтын сактоого чакыруу"],"k":3,"e":"Текст акыркы абзацта чакырык менен бүтөт: «эми, эмне кылышыбыз керек?» (80-сап), ошондой эле токтотуу зарыл экени, баш кийимдин «түпкү маани-маңызын сактоо» керектиги, ал «элдин ыйык буюму» экени айтылат. Демек, автор замандаштарды ата салтын сактоого чакырат.","x":["Текст баш кийимдер тууралуу толук маалымат берүү үчүн жазылган эмес, бул чакырык.","Уздар жөнүндө сөз бар (39-45, 86-89-саптар), бирок анда сын да бар, даңазалоо негизги максат эмес.","Автор тыюу салууну сунуштабайт, ашыкча чыгарууну жана көрүнгөнгө берүүнү токтотууну сунуштайт.",""]},{"q":"46-53-саптардагы сүйлөмдө берилген башкы ой кайсы?","o":["Элдин баш кийимди бардык белектен жогору эсептеши","Кыргыз урууларынын той-ашты көп бериши","Элде аттын, тондун, куштун көптүгүн көрсөтүшү","Элдин конокко төбөлдөрдү гана чакырышы"],"k":0,"e":"46-53-саптарда баяндалат: бир уруунун төбөлү экинчи уруунун ашына конок болсо, өтө сый конокко гана калпак же тебетей тиктирилген, калган сыйлуу коноктор үчүн ат тартып, тон жаап, куш кондуруу менен чектелишкен. Демек, баш кийим башка белектерден жогору турган.","x":["","Той-аштын көптүгү жөнүндө эмес, белектин баасы тууралуу сөз болууда.","Ат, тон, куш — калпактан төмөн турган белектер катары айтылган, алардын көптүгү эмес.","Сый конокко гана тиктирилген, ал эми башка сыйлуу коноктор да чакырылган, ошондуктан «төбөлдөрдү гана» деген туура эмес."]},{"q":"30-34-саптардагы сүйлөмдүн контекстинде “мурдумдан алысты көрө албайм” деген түшүнүк кандай маанини билдирет?","o":["Көздүн начар көрүүсүн","Ой жүгүртүүнүн чектелгендигин","Өз кызыкчылыгын гана ойлоону","Илим-билимдин жетишсиздигин"],"k":1,"e":"30-34-саптарда калпактын эки кулакчыны жырык тумшукчага айланганы айтылат: «мурдумдан алысты көрө албайм дегенсип». Бул көз начар көрөт дегенди түз эмес, ой-кыялы кең эмес, алысты ойлой албай калган ой жүгүртүүнүн чектелгендигин билдирет.","x":["Көздүн начарлыгы түз маани, ал эми сөз калпактын өзгөргөн формасына мазактоо катары келип жатат.","","Өз кызыкчылыгы жөнүндө текст сөз кылбайт.","Илим-билим жөнүндө сөз жок."]},{"q":"Текст боюнча ак калпак менен тебетейдин окшоштугу эмнеде?\nI.  Атайын арнап тигилишинде\nII. Өңдөрүнүн бирдейлигинде\nIII. Тиликтеринин бирдейлигинде\nIV. Төрт тараптуу экендигинде","o":["I гана","I, II гана","I, III гана","I, IV гана"],"k":3,"e":"Текстте тебетей ак калпак менен салыштырылат: «Тебетейибиз деле ушул нукта жасалат» (19-сап), демек ал да төрт тарапка бөлүнгөн формада (IV). Ошондой эле «калпак же тебетей» башынан эле айылдын аты чыккан уздарга атайын бир адамга арнап тиктирилген (39-42-саптар), демек I да туура. Түсү (II) жана тиликтери (III) жөнүндө окшоштук айтылган эмес.","x":["I туура, бирок IV да туура, ошондуктан «гана» деген жооп толук эмес.","II жөнүндө текст эч нерсе айтпайт.","III ак калпакка гана тиешелүү (20-22-саптар), тебетей үчүн айтылган эмес.",""]} function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
function gtext(text) {

}

  return h('span', { class: 'pair' },
    h('span', { class: 'pl' }, text.slice(0, i)),
    h('span', { class: 'pc' }, ':'),
    h('span', { class: 'pr' }, text.slice(i + 3)));
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  set(filter);

/* passage rendering */
function tokens(s) { return s.toLowerCase().split(/[\s«»"“”(),.;:!?…—–]+/).filter(Boolean); }
function flowParas(p) {
  const L = p.lines;
  const vocab = new Set();
  L.forEach(l => tokens(l[1]).forEach(w => vocab.add(w)));
  const lens = L.map(l => l[1].length).sort((a, b) => a - b);
  const med = lens[Math.floor(lens.length / 2)] || 40;
  const paras = []; let parts = [];
  const flush = () => { if (parts.length) { paras.push(parts); parts = []; } };
  L.forEach((l, idx) => {
    const n = l[0], txt = l[1];
    const prev = idx ? L[idx - 1][1] : '';
    let glue = ' ';
    if (idx && /\S-$/.test(prev)) {
      const A = (prev.match(/([^\s«»"(]+)-$/) || [])[1] || '';
      const B = (txt.match(/^[«"(]*([^\s,.;:!?»")]+)/) || [])[1] || '';
      const al = A.toLowerCase(), bl = B.toLowerCase();
      if (vocab.has(al + '-' + bl)) glue = 'keep';
      else if (vocab.has(al + bl)) glue = 'drop';
      else if (bl.length <= 3 || /^[а-яөүң]/.test(B) && !vocab.has(bl)) glue = 'drop';
      else glue = 'keep';
    }
    if (idx) {
      if (glue === 'drop') { const last = parts[parts.length - 1]; if (typeof last === 'string') parts[parts.length - 1] = last.replace(/-$/, ''); }
      else if (glue === 'keep') { /* join without space */ }
      else { const last = parts[parts.length - 1]; if (typeof last === 'string') parts[parts.length - 1] = last + ' '; else parts.push(' '); }
    }
    if (n) parts.push({ n });
    parts.push(txt);
    if (/[.?!…»)]$/.test(txt.trim()) && txt.length < med * 0.8) flush();
  });
  flush();
  return paras;
}
function passageEl(p, mode) {
  const head = [];
  if (p.label) head.push(h('p', { class: 'plabel' }, p.label));
  if (p.source) head.push(h('p', { class: 'psrc' }, p.source));
  if (p.note) head.push(h('p', { class: 'pnote' }, p.note));
  let body;
  if (mode === 'lines') {
    body = h('div', { class: 'lines', tabindex: '0', role: 'region', 'aria-label': 'Текст, саптар боюнча' },
      p.lines.map(l => h('div', { class: 'ln' }, h('span', { class: 'num' }, l[0] ? String(l[0]) : ''), h('span', { class: 'tx' }, l[1]))));
  } else {
    body = h('div', { class: 'flow' }, flowParas(p).map(parts =>
      h('p', null, parts.map(x => typeof x === 'string' ? x : h('sup', { class: 'mk', 'aria-label': x.n + '-сап' }, String(x.n))))));
  }
  return h('div', { class: 'passage' }, head, body);
}
function textPane(t, onMode) {
  const mode = rcMode();
  const holder = h('div', { class: 'ptext' });
  function draw() {
    const m = rcMode();
    holder.replaceChildren(...t.passages.map(p => passageEl(p, m)));
  }
  draw();
  return h('section', { class: 'pane-text' },
    h('div', { class: 'tools' }, h('span', { class: 'lbl' }, 'Текст')),
    h('h2', { class: 'ptitle' }, t.title),
    t.source ? h('p', { class: 'psrc' }, t.source) : null,
    t.intro ? h('p', { class: 'pint' }, t.intro) : null,
    holder);
}
function rcMode() {
  return 'lines';
}
function rcModeOld() {
  const m = lsGet('rc-mode', null);
  if (m === 'lines' || m === 'flow') return m;
  return window.matchMedia('(max-width: 599px)').matches ? 'flow' : 'lines';
}

function startRc(i) {
  stopTimer();
  rc = { t: i, ans: Array(RC[i].questions.length).fill(null), start: Date.now(), deadline: Date.now() + RC_MIN * 60000, finished: false, confirming: false, pane: 'text', iv: null };
  renderRcQuiz(); toTop();
  rc.iv = setInterval(tick, 500);
}
function tick() {
  if (!rc || rc.finished) { stopTimer(); return; }
  const left = Math.max(0, rc.deadline - Date.now());
  const el = document.getElementById('timer');
  if (el) {
    el.textContent = fmt(left);
    el.className = 'timer' + (left < 60000 ? ' bad' : left < 300000 ? ' warn' : '');
  }
  if (left <= 0) finishRc(true);
}
function measureHead() {
  const hd = document.getElementById('rchead');
  if (hd) document.documentElement.style.setProperty('--head-h', hd.offsetHeight + 'px');
}
function rcAnswered() { return rc.ans.filter(x => x !== null).length; }
function renderRcQuiz() {
  setView('rc-quiz');
  const t = RC[rc.t], N = t.questions.length;
  const body = h('div', { class: 'rc-body', 'data-pane': rc.pane });
  const qpane = h('section', { class: 'pane-q' });
  const qcards = t.questions.map((q, qi) => {
    const btns = q.o.map((txt, j) => h('button', { class: 'ropt', type: 'button', 'aria-pressed': 'false', onclick: () => rcPick(qi, j) },
      h('span', { class: 'ltr' }, LET[j]), h('span', { class: 'ot' }, txt)));
    const card = h('div', { class: 'qcard', id: 'q' + qi },
      h('div', { class: 'qhead' }, h('span', { class: 'qbadge' }, String(qi + 1)), h('span', { class: 'eyebrow' }, 'Суроо ' + (qi + 1))),
      h('p', { class: 'qstem' }, q.q),
      h('div', { class: 'ropts', role: 'group', 'aria-label': 'Жооп варианттары' }, btns));
    card._btns = btns;
    return card;
  });
  qpane.append(...qcards);
  const swText = h('button', { type: 'button', 'aria-pressed': String(rc.pane === 'text'), onclick: () => setPane('text') }, 'Текст');
  const swQ = h('button', { type: 'button', id: 'swq', 'aria-pressed': String(rc.pane === 'q'), onclick: () => setPane('q') }, 'Суроолор');
  function setPane(p) {
    rc.pane = p; body.dataset.pane = p;
    swText.setAttribute('aria-pressed', String(p === 'text')); swQ.setAttribute('aria-pressed', String(p === 'q'));
    toTop();
  }
  const finishBtn = h('button', { class: 'btn sm', type: 'button', id: 'finbtn', onclick: onFinish }, 'Аяктоо');
  const confirmHolder = h('div', { id: 'confirm' });
  const exitBtn = h('button', { class: 'link', type: 'button', onclick: () => {
    if (!rc.exitAsk) { rc.exitAsk = true; exitBtn.textContent = 'Чыгуу? Дагы бир жолу басыңыз'; setTimeout(() => { if (rc) { rc.exitAsk = false; exitBtn.textContent = 'Чыгуу'; } }, 4000); return; }
    stopTimer(); renderRcList();
  } }, 'Чыгуу');
  const left = Math.max(0, rc.deadline - Date.now());
  const head = h('header', { class: 'rc-head', id: 'rchead' },
    h('div', { class: 'rc-row' },
      exitBtn,
      h('p', { class: 'count', id: 'cnt' }),
      h('div', { class: 'timer' + (left < 60000 ? ' bad' : left < 300000 ? ' warn' : ''), id: 'timer', role: 'timer', 'aria-label': 'Калган убакыт' }, fmt(left)),
      finishBtn),
    h('p', { class: 'rc-title' }, 'Текст ' + (rc.t + 1) + '. ' + t.title),
    h('div', { class: 'rc-switch' }, h('div', { class: 'seg', role: 'group', 'aria-label': 'Бөлүк' }, swText, swQ)),
    confirmHolder);
  body.append(textPane(t), qpane);
  mount(head, body);
  rc.ui = { qcards, finishBtn, confirmHolder };
  updateRcCounts();
  qcards.forEach((c, qi) => refreshCard(qi));
  measureHead();
}
function updateRcCounts() {
  const N = RC[rc.t].questions.length, a = rcAnswered();
  const c = document.getElementById('cnt'); if (c) c.textContent = a + ' / ' + N + ' жооп';
  const sq = document.getElementById('swq'); if (sq) sq.textContent = 'Суроолор · ' + a + '/' + N;
}
function refreshCard(qi) {
  const card = rc.ui.qcards[qi], a = rc.ans[qi];
  card.classList.toggle('done', a !== null);
  card._btns.forEach((b, j) => { const on = a === j; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); });
}
function rcPick(qi, j) {
  if (rc.finished) return;
  rc.ans[qi] = rc.ans[qi] === j ? null : j;
  refreshCard(qi); updateRcCounts();
  if (rc.confirming) { rc.confirming = false; rc.ui.confirmHolder.replaceChildren(); measureHead(); }
}
function onFinish() {
  const N = RC[rc.t].questions.length, left = N - rcAnswered();
  if (left > 0 && !rc.confirming) {
    rc.confirming = true;
    const idx = rc.ans.map((a, i) => a === null ? i + 1 : null).filter(Boolean).join(', ');
    rc.ui.confirmHolder.replaceChildren(h('div', { class: 'confirm', role: 'alert' },
      h('p', null, 'Жооп берилбеген суроолор: ' + idx + '. Аяктайсызбы?'),
      h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { rc.confirming = false; rc.ui.confirmHolder.replaceChildren(); measureHead(); } }, 'Улантуу'),
      h('button', { class: 'btn sm', type: 'button', onclick: () => finishRc(false) }, 'Аяктоо')));
    measureHead();
    return;
  }
  finishRc(false);
}
function isOk(q, a) { return a !== null && (a === q.k || (q.alt || []).includes(a)); }
function finishRc(timeout) {
  if (!rc || rc.finished) return;
  rc.finished = true; stopTimer();
  rc.used = Math.min(RC_MIN * 60000, Date.now() - rc.start);
  rc.timeout = timeout;
  rc.score = RC[rc.t].questions.reduce((n, q, j) => n + (isOk(q, rc.ans[j]) ? 1 : 0), 0);
  saveBest('rc-best', rc.t, rc.score);
  rcFilter = 'all';
  renderRcResult(); toTop();
}
function optReview(q, j, a) {
  const alt = (q.alt || []).includes(j), key = j === q.k;
  const correct = key || alt;
  let cls = 'ropt', tag = null;
  if (correct) {
    cls += ' ok';
    if ((q.alt || []).length) tag = key ? (a === j ? 'Сиздин жооп. Ачкычтагы жооп' : 'Ачкычтагы жооп') : (a === j ? 'Сиздин жооп. Текст боюнча туура' : 'Текст боюнча туура');
    else tag = a === j ? 'Сиздин жооп, туура' : 'Туура жооп';
  } else if (a === j) { cls += ' bad'; tag = 'Сиздин жооп, ката'; }
  return h('div', { class: cls },
    h('span', { class: 'ltr' }, LET[j]), h('span', { class: 'ot' }, q.o[j]),
    tag ? h('span', { class: 'tag' }, tag) : null,
    q.x[j] ? h('span', { class: 'rs' }, q.x[j]) : null);
}
function renderRcResult() {
  setView('rc-result');
  const t = RC[rc.t], N = t.questions.length, score = rc.score;
  const pct = Math.round(score / N * 100);
  const skipped = rc.ans.filter(x => x === null).length;
  const msg = pct >= 90 ? 'Эң сонун натыйжа.' : pct >= 70 ? 'Жакшы натыйжа. Каталарды талдоодон карап чыгыңыз.' : pct >= 50 ? 'Орточо. Ката кеткен суроолордогу түшүндүрмөнү окуңуз.' : 'Тексттин саптарына кайрылып, талдоону окуңуз.';
  const list = h('div', { class: 'rev' });
  function fill() {
    const items = t.questions.map((q, j) => ({ q, j })).filter(({ q, j }) => rcFilter === 'all' || !isOk(q, rc.ans[j]));
    list.replaceChildren(...items.map(({ q, j }) => {
      const a = rc.ans[j], ok = isOk(q, a);
      const chip = a === null ? h('span', { class: 'chip skip' }, 'Жооп берилген жок') : h('span', { class: 'chip ' + (ok ? 'ok' : 'bad') }, ok ? 'Туура' : 'Ката');
      const short = q.q.split('\n')[0];
      return h('details', { class: 'item', open: !ok },
        h('summary', null, h('span', { class: 'qn' }, String(j + 1)), h('span', { class: 'qstem' }, short.length > 110 ? short.slice(0, 107) + '…' : short), chip),
        h('div', { class: 'body' },
          h('p', { class: 'qstem' }, q.q),
          h('div', { class: 'ropts' }, q.o.map((_, k) => optReview(q, k, a))),
          h('div', { class: 'exp' }, h('p', { class: 'why-h' }, 'Эмне үчүн?'), h('p', { class: 'why' }, q.e)),
          q.w ? h('p', { class: 'note warn' }, h('b', null, 'Көңүл буруңуз. '), q.w) : null,
          q.i ? h('p', { class: 'note' }, h('b', null, 'Эскертүү. '), q.i) : null));
    }));
    if (!list.children.length) list.append(h('p', { class: 'note' }, 'Каталар жок. Бардык суроого туура жооп бердиңиз.'));
  }
  const tabAll = h('button', { class: 'tab', type: 'button', onclick: () => set('all') }, 'Бардык суроолор');
  const tabWrong = h('button', { class: 'tab', type: 'button', onclick: () => set('wrong') }, 'Каталар жана жоопсуздар');
  function set(f) { rcFilter = f; tabAll.setAttribute('aria-pressed', String(f === 'all')); tabWrong.setAttribute('aria-pressed', String(f === 'wrong')); fill(); }
  set(rcFilter);
  const okList = t.questions.map((q, j) => isOk(q, rc.ans[j]) ? j + 1 : null).filter(Boolean);
  const badList = t.questions.map((q, j) => !isOk(q, rc.ans[j]) ? j + 1 : null).filter(Boolean);
  mount(
    h('div', { class: 'bar' }, h('button', { class: 'link', type: 'button', onclick: renderRcList }, 'Тексттер тизмеси'), h('p', { class: 'count' }, 'Текст ' + (rc.t + 1))),
    h('section', { class: 'score' },
      h('p', { class: 'kicker' }, 'Жыйынтык · ' + t.title),
      h('p', { class: 'big' }, score + ' / ' + N),
      h('div', { class: 'meter', role: 'img', 'aria-label': pct + ' пайыз' }, h('i', { style: 'width:' + pct + '%' })),
      h('p', null, pct + '% туура. ' + msg),
      h('div', { class: 'facts' },
        h('span', { class: 'fact' }, 'Убакыт: ' + fmt(rc.used) + ' / ' + RC_MIN + ':00'),
        rc.timeout ? h('span', { class: 'fact' }, 'Убакыт бүттү') : null,
        skipped ? h('span', { class: 'fact' }, 'Жоопсуз: ' + skipped) : null),
      h('p', { class: 'meta' }, 'Туура: ' + (okList.join(', ') || '—') + '. Ката же жоопсуз: ' + (badList.join(', ') || '—') + '.'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => startRc(rc.t) }, 'Кайра тапшыруу'),
        rc.t < RC.length - 1 ? h('button', { class: 'btn ghost', type: 'button', onclick: () => renderRcIntro(rc.t + 1) }, 'Кийинки текст') : null,
        h('button', { class: 'btn ghost', type: 'button', onclick: renderRcList }, 'Тексттер тизмеси'))),
    h('details', { class: 'review-text' },
      h('summary', null, 'Текстти кайра окуу (сап номерлери менен)'),
      textPane(t)),
    h('h2', { class: 'ptitle' }, 'Талдоо'),
    h('div', { class: 'tabs' }, tabAll, tabWrong),
    list);
}

window.addEventListener('resize', () => { if (view === 'rc-quiz') measureHead(); });
renderGate();
