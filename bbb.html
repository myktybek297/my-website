<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Аналогия, окуу жана грамматика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,700&display=swap">
<style>
/* Layout: one narrow column for lists and analogy tests. Reading tests widen to two panes on large screens: passage on the left (own scroll), questions on the right. */
:root {
  --bg: #F3F4FB;
  --surface: #FFFFFF;
  --fg: #161A33;
  --muted: #5B6285;
  --line: #DDE0F0;
  --accent: #3F4FC9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6E9FD;
  --mark: #E0731A;
  --ok: #17703A;
  --ok-bg: #E1F2E7;
  --bad: #B3261E;
  --bad-bg: #FAE6E4;
  --warn-bg: #FFF1CC;
  --warn-fg: #664700;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-disp: 'Manrope', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-read: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --r: 18px;
  --shadow: 0 1px 2px rgba(30,40,90,.06), 0 8px 24px -12px rgba(30,40,90,.18);
  --head-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1226; --surface: #181C38; --fg: #E8EAFB; --muted: #9AA2CC; --line: #2A3059;
    --accent: #8E9BFF; --accent-ink: #0B1033; --accent-soft: #232A5C; --mark: #FFB066;
    --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
    --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1226; --surface: #181C38; --fg: #E8EAFB; --muted: #9AA2CC; --line: #2A3059;
  --accent: #8E9BFF; --accent-ink: #0B1033; --accent-soft: #232A5C; --mark: #FFB066;
  --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
  --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
img, svg, video, canvas { max-width: 100%; height: auto; }
body {
  background: linear-gradient(180deg, var(--accent-soft) 0, var(--bg) 280px) no-repeat, var(--bg); color: var(--fg);
  font: 400 1rem/1.55 var(--f-ui);
  overflow-wrap: break-word;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent-soft); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Home */
.hero { display: grid; gap: 10px; padding: 12px 0 22px; }
.kicker { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero h1 { font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.1 var(--f-disp); }
.hero p { color: var(--muted); max-width: 52ch; }
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 14px; }
.sec {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px;
  display: grid; gap: 14px; align-content: start; text-align: left; min-width: 0; width: 100%;
}
.sec { box-shadow: var(--shadow); }
.sec:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile, .card, .score, .qcard, .pane-text { box-shadow: var(--shadow); }
.sec h2 { font: 700 1.6rem/1.15 var(--f-disp); }
.sec .desc { color: var(--muted); }
.sec .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); gap: 12px; }
.tiles.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 12px; align-content: start; text-align: left; min-width: 0;
}
.tile .num { font: 700 2.1rem/1 var(--f-disp); color: var(--accent); }
.tile h3 { font: 700 1.15rem/1.25 var(--f-disp); }
.tile .meta { color: var(--muted); font-size: .9rem; }
.tile .best { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile:hover { border-color: var(--accent); }
.btn {
  box-shadow: 0 6px 14px -8px var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: 999px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; }
.btn.sm { min-height: 40px; padding: 8px 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.legend { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
.legend b { color: var(--fg); }
.list-head { display: grid; gap: 6px; margin-bottom: 18px; }
.list-head h1 { font: 700 clamp(1.7rem, 5vw, 2.2rem)/1.15 var(--f-disp); }
.list-head p { color: var(--muted); }

/* Analogy quiz */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin-bottom: 14px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 44px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.dots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.dot {
  min-width: 0; min-height: 2.5rem; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0;
}
.dot.cur { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; display: grid; gap: 16px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: .92rem; }
.stem { padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.pair { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.pc { color: var(--mark); font-weight: 700; }
.stem .pair { font: 700 clamp(1.45rem, 5.2vw, 2rem)/1.25 var(--f-disp); overflow-wrap: anywhere; }
.stem .pc { font-size: 1.15em; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: baseline;
  width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); min-height: 48px;
}
.opt:hover { border-color: var(--accent); }
.opt .ltr {
  display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  border: 1.5px solid var(--line); font-weight: 600; font-size: .9rem; align-self: center;
}
.opt .pair { font: 500 1.08rem/1.35 var(--f-disp); overflow-wrap: anywhere; }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--line); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }
.opt .tag { grid-column: 2; font: 600 .8rem var(--f-ui); }
.opt.ok .tag { color: var(--ok); }
.opt.bad .tag { color: var(--bad); }

.fb { border-radius: var(--r); padding: 16px; display: grid; gap: 10px; border: 1.5px solid var(--line); }
.fb.ok { border-color: var(--ok); background: var(--ok-bg); }
.fb.bad { border-color: var(--bad); background: var(--bad-bg); }
.verdict { font-weight: 700; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.why-h { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.rel { font-weight: 600; }
.why { max-width: 66ch; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; }
.note.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.note b { font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.score { display: grid; gap: 12px; padding: 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.score .big { font: 700 clamp(2.6rem, 11vw, 3.6rem)/1 var(--f-disp); font-variant-numeric: tabular-nums; color: var(--accent); }
.meter { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; min-height: 40px; }
.tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.rev { display: grid; gap: 10px; }
details.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
details.item > summary {
  list-style: none; cursor: pointer; padding: 12px 14px; display: grid;
  grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
}
details.item > summary::-webkit-details-marker { display: none; }
.qn { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
details.item .pair { font: 700 1.1rem/1.3 var(--f-disp); overflow-wrap: anywhere; }
.chip { font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.skip { background: var(--line); color: var(--muted); }
.item .body { padding: 2px 14px 14px; display: grid; gap: 10px; }
.ans { display: grid; gap: 4px; font-size: .95rem; }
.ans .pair { font: 500 1.02rem/1.35 var(--f-disp); }
.ans b { font-weight: 600; }

.timer.sm { font-size: 1rem; padding: 6px 10px; min-width: 4.4rem; }
.gt { white-space: pre-line; overflow-wrap: anywhere; }
.gt u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.opt .gt { font: 500 1.05rem/1.4 var(--f-disp); }
.gr .stem .gt { font: 600 1.2rem/1.5 var(--f-disp); }
details.item .gt { font: 600 1rem/1.35 var(--f-disp); }

.gate { max-width: 26rem; margin: 8vh auto 0; }
.gate h1 { font: 700 clamp(1.7rem, 6vw, 2.2rem)/1.15 var(--f-disp); }
.code { width: 100%; font: 700 2rem/1 var(--f-ui); letter-spacing: .5em; text-align: center; padding: 14px 8px 14px calc(8px + .5em); border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums; }
.cerr { color: var(--bad); font-weight: 600; min-height: 1.4em; }

/* Reading comprehension */
.intro-card { display: grid; gap: 14px; }
.intro-card h1 { font: 700 clamp(1.6rem, 5vw, 2.2rem)/1.15 var(--f-disp); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; color: var(--muted); }
.rc-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line);
  display: grid; gap: 8px;
}
.rc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.rc-title { font: 700 1.05rem/1.25 var(--f-disp); min-width: 0; flex: 1 1 10rem; }
.timer {
  font: 700 1.35rem/1 var(--f-ui); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent); min-width: 5.2rem; text-align: center;
}
.timer.warn { background: var(--warn-bg); color: var(--warn-fg); }
.timer.bad { background: var(--bad-bg); color: var(--bad); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rc-switch { display: flex; }
.rc-switch .seg { width: 100%; }
.rc-switch .seg button { flex: 1 1 0; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-fg); }
.confirm p { flex: 1 1 14rem; font-weight: 600; }
.rc-body { display: grid; gap: 16px; }
.pane-text, .pane-q { min-width: 0; }
.pane-text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px; display: grid; gap: 14px; align-content: start; }
.pane-q { display: grid; gap: 14px; align-content: start; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tools .lbl { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ptitle { font: 700 1.35rem/1.2 var(--f-disp); }
.psrc { color: var(--muted); font-size: .9rem; }
.pint { font: italic 400 1rem/1.55 var(--f-read); color: var(--muted); }
.plabel { font-weight: 700; color: var(--accent); padding-top: 4px; }
.pnote { font-size: .85rem; color: var(--warn-fg); background: var(--warn-bg); padding: 8px 10px; border-radius: 8px; }
.passage { display: grid; gap: 8px; min-width: 0; }
.lines { overflow-x: auto; font: 400 clamp(.84rem, 1.6vw + .45rem, 1.05rem)/1.75 var(--f-read); padding-bottom: 4px; }
.ln { display: flex; gap: 10px; align-items: baseline; }
.ln .num { flex: none; width: 2.4rem; text-align: right; color: var(--accent); font: 600 .75rem var(--f-ui); font-variant-numeric: tabular-nums; }
.ln .tx { white-space: pre; }
.flow p { margin: 0 0 .8em; font: 400 1.04rem/1.75 var(--f-read); text-wrap: pretty; }
.flow sup.mk { font: 600 .66rem var(--f-ui); color: var(--accent); margin: 0 .25em 0 .35em; vertical-align: super; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 14px; display: grid; gap: 12px; min-width: 0; }
.qcard.done { border-color: var(--accent); }
.qhead { display: flex; align-items: center; gap: 10px; }
.qbadge { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.qstem { white-space: pre-line; font: 600 1.02rem/1.5 var(--f-disp); }
.ropts { display: grid; gap: 8px; }
.ropt {
  display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left; width: 100%;
  padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 46px;
}
.ropt .ltr { display: inline-grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 1.5px solid var(--line); font-weight: 600; font-size: .85rem; align-self: start; }
.ropt .ot { overflow-wrap: anywhere; }
button.ropt:hover { border-color: var(--accent); }
.ropt.sel { border-color: var(--accent); background: var(--accent-soft); }
.ropt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ropt.ok { border-color: var(--ok); background: var(--ok-bg); }
.ropt.ok .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.ropt.bad { border-color: var(--bad); background: var(--bad-bg); }
.ropt.bad .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.ropt .tag { grid-column: 2; font: 600 .8rem var(--f-ui); }
.ropt.ok .tag { color: var(--ok); }
.ropt.bad .tag { color: var(--bad); }
.ropt .rs { grid-column: 2; font-size: .92rem; color: var(--muted); }
.ropt.ok .rs, .ropt.bad .rs { color: var(--fg); }
.exp { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 6px; }
.exp .why { white-space: pre-line; }
.review-text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.review-text > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; min-height: 44px; }
.review-text .pane-text { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }

@media (max-width: 899px) {
  .rc-body[data-pane="text"] .pane-q { display: none; }
  .rc-body[data-pane="q"] .pane-text { display: none; }
}
@media (min-width: 900px) {
  .rc-switch { display: none; }
}
@media (min-width: 1000px) {
  body[data-view="rc"] .wrap { max-width: 82rem; }
  .rc-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .rc-body .pane-text {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 8px);
    max-height: calc(100vh - var(--head-h) - 28px); overflow-y: auto;
  }
}

/* Responsive steps (320px and up) */
@media (max-width: 479px) {
  .card { padding: 16px 14px; }
  .nav .btn { flex: 1 1 100%; }
  .actions .btn { flex: 1 1 100%; }
  details.item > summary { grid-template-columns: 2rem minmax(0, 1fr); }
  details.item > summary .chip { grid-column: 2; justify-self: start; }
  .tab { flex: 1 1 auto; }
  .rc-title { flex-basis: 100%; }
}
@media (min-width: 480px) {
  .dots { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .nav .btn { flex: 0 1 auto; }
}
@media (min-width: 640px) {
  .secs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 600px) {
  .wrap { padding-block: 32px 72px; }
  .hero { padding: 20px 0 28px; }
  .tile { padding: 20px; }
  .sec { padding: 24px 22px; }
  .card { padding: 26px 24px; gap: 18px; }
  .stem { padding: 18px 20px; }
  .score { padding: 26px 24px; }
  details.item > summary { padding: 14px 18px; }
  .item .body { padding: 2px 18px 18px; }
  .qcard { padding: 20px 20px; }
  .pane-text { padding: 20px 20px; }
}
@media (min-width: 900px) {
  .wrap { max-width: 56rem; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { height: 100%; }
  .dot { min-height: 2.75rem; }
}
@media (min-width: 1200px) {
  .wrap { max-width: 62rem; padding-block: 40px 88px; }
  .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tiles.wide { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
}
@media (max-height: 480px) and (orientation: landscape) {
  .wrap { padding-block: 12px 32px; }
  .hero { padding: 4px 0 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .ropt, .btn, .tile, .sec, .dot { transition: border-color .15s, background-color .15s; }
}
</style>

<script>
const TESTS = [[{"n":39,"s":"Сулуу : серт","o":["Бийик : кыска","Чың : морт","Бекем : ийменчээк","Бакыт : капа"],"k":1,"r":"Антоним (карама-каршы маани)","e":"Суроодогу жуп карама-каршы мааниде берилген. «Чың» (бекем, сынбас) менен «морт» (оңой сынат) да карама-каршы сөздөр. Бийик : кыска жана бакыт : капа тең эмес, ал эми бекем : ийменчээк байланышсыз."},{"n":7,"s":"Тоюу : тамактануу","o":["Чарчоо : чуркоо","Айруу : кесүү","Жутуу : чайноо","Сынуу : тебүү"],"k":0,"r":"Натыйжа : анын себеби","e":"Тоюу тамактануунун натыйжасы (тамактансак тоюп калабыз). Чарчоо да чуркоонун натыйжасы. Калган варианттарда себеп менен натыйжа жок: айруу менен кесүү окшош иштер, жутуу менен чайноо тамак жеүүнүн баскычтары, сынуу менен тебүү байланышсыз."},{"n":78,"s":"Жүгүрүү : ден-соолук","o":["Тамак : ашказан","Шылдыңдоо : көңүл","Күлүү : маанай","Спорт : дене"],"k":2,"r":"Аракет : ал берген пайда","e":"Жүгүрүү ден-соолукка жакшы. Күлүү маанайды көтөрөт. Экөө тең «аракет : ал жакшырткан нерсе»."},{"n":70,"s":"Апта : шаршемби","o":["Ай : февраль","Минута : секунда","Жыл : июнь","Убакыт : мезгил"],"k":2,"r":"Бүтүн : анын бир бөлүгү","e":"Апта күндөрдөн турат, шаршемби анын бир күнү. Жыл айлардан турат, июнь анын бир айы. «Бүтүн : анын бир бөлүгү» ушул. Ай : февраль туура эмес, февраль айдын бөлүгү эмес, өзү бир ай."},{"n":3,"s":"Дальтонизм : көз","o":["Астма : өпкө","Псориаз : бут","Кардиолог : жүрөк","ЛОР : мурун"],"k":0,"r":"Оору : зыян тарткан орган","e":"Дальтонизм көздүн түстү айырмалоо оорусу. Астма да өпкөнүн оорусу. Псориаз тери оорусу, ал эми кардиолог менен ЛОР дарыгерлер, оору эмес, ошондуктан алар башка катарда турат.","w":"Булактагы тестте А вариантында «Астма : көз» деп жазылган, бул ката. Астма өпкө оорусу, ошондуктан бул жерде «өпкө» деп оңдолду."},{"n":43,"s":"Дарак : бутак","o":["Шаты : баскыч","Мейманкана : бөлмө","Шкаф : текче","Китеп : барак"],"k":1,"r":"Бүтүн : анын бөлүгү","e":"Дарак бутактардан турат. Мейманкана бөлмөлөрдөн турат. Экөө тең «бүтүн : анын бөлүгү».","i":"Калган үч вариант да «бүтүн : бөлүк» болуп турат. Ачкыч боюнча туура жооп Б."},{"n":93,"s":"Буйрук : капитан","o":["Буйрук : староста","Буйрук : ата","Буйрук : мугалим","Буйрук : сот"],"k":0,"r":"Буйрук берүүчү","e":"Капитан буйрук берет. Староста да тобун башкарып буйрук берет. Ачкыч боюнча туура жооп А.","i":"Ата, мугалим, сот да буйрук бере алат, ошондуктан бул суроо толук так эмес."},{"n":22,"s":"Көйнөк : үтүктөө","o":["Мебель : тазалоо","Үй : оңдоо","Кездеме : жуу","Бут кийим : майлоо"],"k":3,"r":"Буюм : ага жасалуучу кам көрүү","e":"Көйнөк үтүктөлөт, бут кийим майланат. Экөө тең кийим-кечеге жасалуучу кам көрүү иши. Калган варианттар башка тармакка таандык (үй-мүлк, курулуш)."},{"n":9,"s":"Биология : өсүмдүк","o":["Анатомия : жаныбар","Тарых : өтмүш","Адабият : тил","Астрономия : планета"],"k":3,"r":"Илим : анын изилдөө объектиси","e":"Биология өсүмдүктөрдү (жана жандуу дүйнөнү) үйрөнөт. Астрономия да космостук денелерди, алардын ичинде планеталарды үйрөнөт. «Илим : анын изилдөө объектиси» деген байланыш ушул. Адабият менен тил эки башка илим, ал эми анатомия жаныбар эмес, дененин түзүлүшүн үйрөнөт.","i":"«Тарых : өтмүш» да окшош көрүнөт, бирок ачкыч боюнча туура жооп Г."},{"n":64,"s":"Көз айнек : жакшыртуу","o":["Топ : ойноо","Щётка : щёткалоо","Саат : билүү","Дары : айыктыруу"],"k":3,"r":"Курал : анын максаты","e":"Көз айнек көрүүнү жакшыртат. Дары ооруну айыктырат. Экөө тең «курал : анын максаты». Щётка : щёткалоо сөз тукумун кайталайт, ал эми топ : ойноо жана саат : билүү максат эмес."},{"n":94,"s":"Жашоо : татаал","o":["Өмүр : ыракаттуу","Турмуш : максатсыз","Бакыт : ийгиликтүү","Эгемендүүлүк : баалуу"],"k":0,"r":"Түшүнүк : ага берилген баа","e":"Ачкыч боюнча туура жооп А (өмүр : ыракаттуу).","w":"Бул суроонун логикасы так эмес: «жашоо : татаал» деген жуптан «өмүр : ыракаттуу» болушу керектиги түшүнүксүз. Ачкычты түп нускадан текшерип алыңыз."},{"n":81,"s":"Мык : балка","o":["Сап : балта","Куту : калем","Дасторкон : устел","Суу : чайнек"],"k":3,"r":"Нерсе : аны иштеткен курал","e":"Мык балка менен кагылат. Суу чайнекте кайнатылат. «Нерсе : аны иштеткен курал/идиш».","w":"«Сап : балта» же «дасторкон : устел» да ылайык көрүнөт. Ачкыч Г дейт, текшерип алыңыз."},{"n":23,"s":"Кол чатыр : жамгыр","o":["Араа : устакана","Кайчы : чач тарач","Чырак : жер төлө","Көз айнек : күн"],"k":3,"r":"Коргоочу буюм : андан корголгон нерсе","e":"Кол чатыр жамгырдан коргойт. Көз айнек да күндөн коргойт. Калган варианттарда буюм кандайдыр бир жерде иштейт же иш аткарат, бирок коргоо милдети жок."},{"n":21,"s":"Метр : жип","o":["Акча : рубль","Сотых : аянт","Сантиметр : китеп","Километр : асман"],"k":1,"r":"Өлчөө бирдиги : өлчөнгөн нерсе","e":"Метр жиптин узундугун өлчөөчү бирдик. Сотых (сотка) жер аянтын өлчөөчү бирдик. Ачкыч боюнча туура жооп Б.","w":"«Сантиметр : китеп» да ошол эле логика менен түзүлгөн. Ачкычты түп нускадан текшерип алыңыз."},{"n":92,"s":"Стратосфера : атмосфера","o":["Сейсмология : кыртыш","Жогорку мантия : литосфера","Дүйнөлүк океан : гидросфера","Экосистема : биосфера"],"k":1,"r":"Бөлүк : бүтүн","e":"Стратосфера атмосферанын бир катмары. Жогорку мантия да литосферанын бир бөлүгү. «Бөлүк : бүтүн» ушул.","i":"В жана Г вариантында да бөлүк менен бүтүн бар. Ачкыч боюнча туура жооп Б."},{"n":18,"s":"Ысык : жай","o":["Суук : жаз","Түшүмдүү : күз","Ызгаардуу : кыш","Салкын : жаз"],"k":3,"r":"Сапат : ага мүнөздүү мезгил","e":"Ачкыч боюнча туура жооп Г (салкын : жаз). Жай ысык, жаз салкын деген ойлом.","w":"Бул суроодо «ызгаардуу : кыш» жана «түшүмдүү : күз» да логикага ылайык келет. Ачкыч Г дейт, бирок ката болушу мүмкүн, текшерип алыңыз."},{"n":48,"s":"Топчу : көйнөк","o":["Чорго : чайнек","Сыя : калем","Бантик : чач","Боо : бут кийим"],"k":3,"r":"Бекиткич : анын буюму","e":"Топчу көйнөктү бекитет. Боо бут кийимди бекитет. Экөө тең «бекиткич : ал бекиткен буюм». Калган варианттарда экинчи сөз бекитилген нерсе эмес."},{"n":100,"s":"Гезит : Супер Инфо","o":["Гүл : роза","Повесть : Жамиля","Унаа : Мерседес","Аэропорт : Манас"],"k":2,"r":"Түр : анын белгилүү аталышы","e":"Гезит басма продукциясы, «Супер Инфо» анын аталышы. Унаа : Мерседес да ушундай: унаа түрү жана анын аталышы (бренди). Гүл : роза өсүмдүк түрү, аталыш эмес.","i":"«Повесть : Жамиля» жана «аэропорт : Манас» да аталыштар. Ачкыч боюнча туура жооп В."},{"n":95,"s":"Кылмыш : жаза","o":["Күнөө : тозок","Соода : товар","Сүйүү : бакыт","Жумуш : акы"],"k":3,"r":"Иш : ага татыктуу жооп","e":"Кылмыш жасаганга жаза берилет. Жумуш жасаганга акы төлөнөт. Экөө тең «иш : ага татыктуу жооп»."},{"n":52,"s":"Түлкү : куу","o":["Дельфин : акылдуу","Кумурска : эмгекчил","Пил : чоң","Чычкан : шамдагай"],"k":1,"r":"Жаныбар : анын элдик мүнөзү","e":"Элдик түшүнүктө түлкү куу, кумурска эмгекчил. «Жаныбар : ага мүнөздүү элдик сапат» ушул. Пил : чоң өлчөм, ал мүнөз эмес.","i":"«Дельфин : акылдуу» да ошол эле түргө кирет. Ачкыч боюнча туура жооп Б."}],[{"n":4,"s":"Кыш : лыжа","o":["Жаз : велосипед","Күз : чуркоо","Жай : скутер","Кыш : муз аянтчасы"],"k":2,"r":"Мезгил : ага мүнөздүү каражат","e":"Кышында лыжа тебилет, лыжа кышкы мезгилдин өзүнө таандык буюм. Жайында скутер минилет, ошондуктан «жай : скутер» ошол эле жүйө менен түзүлгөн. Күз : чуркоо иш-аракет, кыш : муз аянтчасы жер, ошондуктан алардын түзүлүшү башкача.","i":"«Жаз : велосипед» да жакын көрүнөт, бирок ачкыч боюнча туура жооп В."},{"n":47,"s":"Жактырбоо : жек көрүү","o":["Капалануу : ыйлоо","Айрылуу : ажыроо","Айтпоо : сүйлөө","Жактыруу : сүйүү"],"k":3,"r":"Начар даража : күчтүү даража","e":"Жактырбоо жек көрүүгө чейин күчөйт. Жактыруу да сүйүүгө чейин күчөйт. Экөө тең бир сезимдин жумшак жана күчтүү даражасы."},{"n":91,"s":"Дарбыз : данектүү","o":["Китеп : маңыздуу","Коон : сары","Мугалим : билимдүү","Акула : тиштүү"],"k":3,"r":"Нерсе : анын өзгөчө белгиси","e":"Дарбыз данектүү. Акула тиштүү. «Нерсе : анын өзгөчө белгиси» ушул."},{"n":5,"s":"Сарай : тулку","o":["Тоокана : короз","Ийин : жылан","Уя : мышык","Үй : карышкыр"],"k":2,"r":"Жайгашкан жер : ал жердеги жан","e":"Ачкыч боюнча туура жооп В (уя : мышык). Суроонун башкы жубу («сарай : тулку») так эмес болгондуктан, ишенимдүү логикалык түшүндүрмө берүү кыйын.","w":"Бул суроодо ката бар окшойт: башкы жуп түшүнүктүү эмес, ал эми В варианты логикага анча дал келбейт («ийин : жылан» же «тоокана : короз» «жашаган жер : жандык» деген байланышка жакыныраак). Түп нускадан текшерип алыңыз."},{"n":25,"s":"Лыжачы : лыжа","o":["Штангист : гантель","Волейболчу : торчо","Сүзүүчү : суу","Футболчу : топ"],"k":3,"r":"Спортчу : анын негизги куралы","e":"Лыжачы лыжа менен чуркайт, лыжа анын негизги куралы. Футболчунун негизги куралы топ. Штангист гантель эмес, штанга менен иштейт. Волейболчуда торчо тосмо, куралы эмес, ал эми суу сүзүүчүнүн чөйрөсү."},{"n":40,"s":"Жип : аркан","o":["Таарынды : тактай","Козу : борук","Кагаз : картон","Дептер : блокнот"],"k":2,"r":"Ичке : жоон (бир материал, ар башка калыңдык)","e":"Жип ичке, аркан жоон, экөө тең бир материалдан жасалат. Кагаз менен картон да бир материал, картон калыңыраак. Калган варианттарда бул байланыш жок."},{"n":60,"s":"Кум : майда","o":["Саман : сары","Топ : тоголок","Уй : семиз","Десерт : таттуу"],"k":1,"r":"Нерсе : анын негизги белгиси","e":"Кум майда болот. Топ тоголок болот. «Нерсе : анын мүнөздүү белгиси» ушул.","i":"Саман : сары, десерт : таттуу да белги болуп көрүнөт. Ачкыч боюнча туура жооп Б."},{"n":96,"s":"Хиджаб : араб","o":["Калпак : кыргыз","Үкү топу : кыргыз","Элечек : кыргыз","Белдемчи : кыргыз"],"k":2,"r":"Баш кийим : ал таандык эл","e":"Хиджаб араб аялдарынын баш кийими. Элечек да кыргыз аялдарынын баш кийими. Калпак эркектики, үкү топу калпактын жасалгасы, ал эми белдемчи белге байланат."},{"n":56,"s":"Машыгуу : жеңүү","o":["Күлдүрүү : жылмаюу","Издөө : табуу","Бириктирүү : чогултуу","Баруу : көрүү"],"k":1,"r":"Аракет : анын максаты","e":"Машыгуунун максаты жеңүү. Издөөнүн максаты табуу. Экөө тең «аракет : анын максаты/жыйынтыгы»."},{"n":53,"s":"Дөңгөлөк : тоголок","o":["Китеп : пайдалануу","Кино : үйрөтүүчү","Китеп : төрт бурчтук","Алмаз : түссүз"],"k":2,"r":"Буюм : анын формасы","e":"Дөңгөлөк тоголок формада. Китеп төрт бурчтук формада. Экөө тең «нерсе : анын формасы». Калган варианттарда экинчи сөз форма эмес."},{"n":62,"s":"Жаан : жаратылыш","o":["Суу : гидрология","Миф : микология","Дин : теология","Эл : психология"],"k":0,"r":"Нерсе : аны үйрөнгөн илим","e":"Суу гидрологиянын изилдөө объектиси, жаан да суу менен байланышкан жаратылыш кубулушу. «Нерсе : аны үйрөнгөн илим» ушул. Миф : микология жана эл : психология туура эмес, илим менен объекти дал келбейт.","i":"«Дин : теология» да мындай байланышка ылайык, бирок ачкыч боюнча туура жооп А."},{"n":84,"s":"Шар : тегерек","o":["Куб : төрт бурчтук","Призма : көп бурчтуу","Үч бурчтук : пирамида","Сүйрү : ийри"],"k":0,"r":"Фигура : анын белгиси","e":"Шар тегерек, куб төрт бурчтук формада. Экөө тең «фигура : анын формасынын белгиси»."},{"n":73,"s":"Шизофрения : психиатрия","o":["Аппендицит : операция","Жаракат : дарыкана","Контузия : оорукана","Кариес : стоматология"],"k":3,"r":"Оору : аны дарылоочу тармак","e":"Шизофренияны психиатрия дарылайт. Кариести стоматология дарылайт. Экөө тең «оору : анын медициналык тармагы»."},{"n":17,"s":"Урук : алма","o":["Көчөт : бак","Түйүлдүк : мышык","Ымыркай : өспүрүм","Урук : өсүмдүк"],"k":1,"r":"Башталыш : андан өнүккөн жан","e":"Урукка алма өсүп чыгат, түйүлдүктөн мышык өнүп чыгат. Экөө тең «биринчи баскыч : андан өнүгүүчү тирүү дүйнө». Г вариантындагы «урук : өсүмдүк» суроодогу «урук» сөзүн кайра колдонуп жаткандыктан ачкычка кирген эмес."},{"n":34,"s":"Чопо : идиш","o":["Суу : муз","Жибек : кийим","Кагаз : куттуктоо баракчасы","Кар : киши"],"k":1,"r":"Материал : андан жасалган буюм","e":"Чоподон идиш жасалат. Жибектен кийим жасалат. Экөө тең «материал : андан жасалган буюм». Суу : муз абалдын өзгөрүшү, кар : киши оюнчук, ал эми кагаз : куттуктоо баракчасы жакын көрүнгөнү менен ачкыч Б."},{"n":98,"s":"Санаторий : эс алуу","o":["Гостиница : эс алуу","Пляж : эс алуу","Пансионат : эс алуу","Жайлоо : эс алуу"],"k":2,"r":"Мекеме : анын милдети","e":"Санаторий эс алуу жана дарыланууга арналган мекеме. Пансионат да эс алууга арналган мекеме. Пляж менен жайлоо табигый жерлер, мекеме эмес.","i":"Гостиница да мекеме, ошондуктан бул суроо толук так эмес. Ачкыч боюнча туура жооп В."},{"n":89,"s":"Каткыруу : жылмаюу","o":["Жинденүү : чыдоо","Урушуу : мактоо","Ыйлоо : өкүрүү","Бакыруу : шыбыроо"],"k":3,"r":"Катуу даража : акырын даража","e":"Каткыруу катуу күлүү, жылмаюу акырын күлүү. Бакыруу катуу чыгуу, шыбыроо акырын сүйлөө. «Катуу : акырын» ушул."},{"n":88,"s":"Шейх : кардинал","o":["Мечит : икона","Үй : батир","Бала : кыз","Президент : султан"],"k":3,"r":"Кызмат : башка системадагы теңдеши","e":"Шейх исламдагы, кардинал католик чиркөөсүндөгү жогорку кызмат. Президент менен султан да башка системадагы мамлекет башчылары. «Кызмат : башка системадагы теңдеши»."},{"n":50,"s":"Тажатуу : жүдөтүү","o":["Оройлонуу : катуу айтуу","Жубатуу : сооротуу","Жуунуу : тазалануу","Даярдануу : машыгуу"],"k":1,"r":"Синоним (маанилеш сөздөр)","e":"Тажатуу менен жүдөтүү маанилеш сөздөр. Жубатуу менен сооротуу да ошондой. Калган варианттарда сөздөр окшош, бирок бирдей мааниде эмес."},{"n":8,"s":"Китеп : китепкана","o":["Парта : класс","Бейтап : оорукана","Мектеп : стол","Кийим : чемодан"],"k":0,"r":"Буюм : ал турган жер","e":"Китеп китепканада турат. Парта классста турат. Экөө тең «буюм : ал турган жер». Бейтап : оорукана да жакын көрүнөт, бирок бейтап адам, ал эми китеп менен парта буюм. В вариантында тартип тескери, Г вариантында маани дал келбейт."}],[{"n":32,"s":"Сүрөтчү : кисть","o":["Сүрөтчү : портрет","Сүрөтчү : боёк","Сүрөтчү : калем сап","Сүрөтчү : кагаз"],"k":2,"r":"Кесип : анын куралы","e":"Сүрөтчү кисть (чөткө) менен иштейт, кисть анын куралы. Калем сап да сүрөтчүнүн куралы. Портрет жыйынтык, боёк материал, кагаз негиз, ошондуктан алар курал эмес."},{"n":75,"s":"Помада : эрин","o":["Лак : манжа","Крем : кол","Пудра : бет","Шампунь : чач"],"k":2,"r":"Косметика : ал жагылган жер","e":"Помада эринге жагылат. Пудра бетке жагылат. Экөө тең «косметика : ал жагылган жер».","i":"А, Б, Г да ошол эле жүйөгө ылайык. Ачкыч боюнча туура жооп В."},{"n":38,"s":"Секирүү : бийик","o":["Эңкейүү : жапыз","Шашуу : алыс","Жетүү : жакын","Түгөтүү : аз"],"k":0,"r":"Аракет : анын багыты","e":"Секирүү бийикке карай жасалат. Эңкейүү жапызга карай жасалат. Экөө тең «аракет : анын багыты». Шашуу менен алыс, жетүү менен жакын, түгөтүү менен аз багытты көрсөтпөйт."},{"n":26,"s":"Транспортир : градус","o":["Тараза : килограмм","Циркуль : тегерек","Сызгыч : узундук","Суу : грамм"],"k":2,"r":"Прибор : ал өлчөгөн чоңдук","e":"Транспортир бурчту градус менен өлчөйт. Сызгыч узундукту өлчөйт. Ачкыч боюнча туура жооп В.","w":"«Тараза : килограмм» да так ушундай («прибор : анын бирдиги») болуп турат, ошондуктан ачкычты текшерип алыңыз."},{"n":6,"s":"Сабак : класс","o":["Буудай : кампа","Концерт : театр","Соода : базар","Оомат : хан сарай"],"k":2,"r":"Иш-аракет : ал өтүүчү негизги жер","e":"Сабак классста өтөт. Соода базарда жүрөт. Экөө тең «иш-аракет : ал жасалуучу негизги жер». Концерт : театр да жакын көрүнөт, бирок концерт ар кандай жерде өтөт, ал эми буудай : кампа буюм менен ал сакталуучу жер, башка байланыш."},{"n":28,"s":"Хирург : оорукана","o":["Окуучу : лаборатория","Актёр : театр","(вариант булак текстте жок)","Мугалим : класс"],"k":1,"r":"Кесип : иштеген жери","e":"Хирург оорукана иштеген жеринде эмгектенет. Актёр театрда иштейт. Экөө тең «кесип : анын иш орду». Окуучу лабораториянын кесиби эмес.","i":"Булактагы тестте В вариантынын текстиси жок. «Мугалим : класс» да окшош көрүнөт, бирок ачкыч боюнча туура жооп Б."},{"n":59,"s":"Формула : эсеп чыгаруу","o":["Акча : сатып алуу","Дары : айыгуу","Отун : жагуу","Бычак : кесүү"],"k":1,"r":"Курал : анын максаты","e":"Формула менен эсеп чыгарабыз. Дары менен айыгабыз. «Курал : ал аткарган максат». Ачкыч боюнча туура жооп Б.","i":"А, В, Г да ушул жүйөгө ылайык келет, ошондуктан бул суроо толук так эмес."},{"n":68,"s":"Сүт эмүүчү : эчки","o":["Маймыл : шимпанзе","Жырткыч : жолборс","Эшек : качыр","Канаттуу : тее куш"],"k":3,"r":"Класс : анын өкүлү","e":"Эчки сүт эмүүчүлөрдүн өкүлү. Куш да канаттууларга таандык. Экөө тең «класс : анын өкүлү».","i":"«Жырткыч : жолборс» жана «маймыл : шимпанзе» да ошол эле түргө кирет. Ачкыч боюнча Г. «Тее куш» сөзү булакта так эмес."},{"n":24,"s":"Пайдасыз : ыргытуу","o":["Белгисиз : издебөө","Керектүү : колдонуу","Иретсиз : чачуу","Белгилүү : тактоо"],"k":1,"r":"Сапат : ага ылайыктуу иш-аракет","e":"Пайдасыз нерсени ыргытабыз. Керектүү нерсени колдонобуз. Экөө тең «нерсенин сапаты : ага ылайык иш-аракет». Калган варианттарда сапат менен иш-аракеттин ортосунда ушундай так байланыш жок."},{"n":90,"s":"Банги : ден-соолук","o":["Макияж : келбет","Таштанды : чөйрө","Темир : дат","Тарбия : жүрүм-турум"],"k":1,"r":"Зыян келтирүүчү : зыян тарткан нерсе","e":"Банги ден-соолукка зыян келтирет. Таштанды чөйрөгө зыян келтирет. Экөө тең «зыян келтирүүчү : анын курмандыгы»."},{"n":86,"s":"Ыр : акын","o":["Роман : автор","Чыгарма : жазуучу","Дары : фармацевт","Мелодия : аспап"],"k":0,"r":"Чыгарма : анын автору","e":"Ыр акындын чыгармасы. Роман автордун чыгармасы. Экөө тең «чыгарма : анын автору».","i":"«Чыгарма : жазуучу» да ошондой, бирок биринчи сөзү жалпы. Ачкыч боюнча туура жооп А."},{"n":20,"s":"Сүйлөм : текст","o":["Боёк : сүрөт","Тыбыш : сөз","Сүйлөм : ой","Идея : роман"],"k":1,"r":"Бөлүк : бүтүн","e":"Сүйлөм тексттин бир бөлүгү. Тыбыш да сөздүн бир бөлүгү. Экөө тең «бөлүк : бүтүн». Боёк : сүрөт да бөлүк-бүтүнгө окшош, бирок «тыбыш : сөз» суроонун тил тармагына жакын."},{"n":82,"s":"Джаз : блюз","o":["Роман : поэма","Комедия : трагедия","Актёр : ырчы","Трио : квартет"],"k":1,"r":"Бир тармактын эки жанры","e":"Джаз менен блюз музыканын эки түрү. Комедия менен трагедия драманын эки түрү. «Бир тармактын эки жанры» ушул. Актёр : ырчы кесиптер.","i":"«Роман : поэма» да адабий жанрлар. Ачкыч боюнча туура жооп Б."},{"n":55,"s":"Доктур : дарылоо","o":["Адабиятчы : жазуу","Тарбиялоо : мугалим","Соодагер : соодалашуу","Окумуштуу : изилдөө"],"k":3,"r":"Кесип : анын негизги иши","e":"Доктур дарылайт. Окумуштуу изилдейт. «Кесип : анын негизги иши». Тарбиялоо : мугалим тескери тартипте турат.","i":"«Соодагер : соодалашуу» да окшош көрүнөт. Ачкыч боюнча туура жооп Г."},{"n":69,"s":"Туз : даам","o":["Жылыткыч : аба","Шекер : чай","Атыр : жыт","Суу : ылай"],"k":2,"r":"Зат : ал берген сезим","e":"Туз даам берет. Атыр жыт берет. Экөө тең «зат : ал берген сезим»."},{"n":42,"s":"Колдонуу : эскирүү","o":["Ыргытуу : кирүү","Ооруу : жатуу","Зеригүү : ойноо","Ачуу : жабуу"],"k":1,"r":"Себеп : натыйжа","e":"Бир нерсени көп колдонсок, ал эскирет. Ооруса адам жатат. Экөө тең «себеп : натыйжа». Ачуу менен жабуу карама-каршы, ыргытуу : кирүү байланышсыз."},{"n":85,"s":"Күн : Космос","o":["Кычкылтек : Жер","Ай : орбита","Жылдыз : асман","Жаныбар : токой"],"k":2,"r":"Объект : ал таандык мейкиндик","e":"Күн Космостогу жылдыз. Жылдыз да асман мейкиндигине таандык. «Объект : ал таандык мейкиндик» ушул."},{"n":67,"s":"Семиз : толук","o":["Кызыл : кызгылтым","Өйдө : бийик","Бала : өспүрүм","Кер : азиз"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Ачкыч боюнча туура жооп Г.","w":"«Өйдө : бийик» синоним катары көбүрөөк ылайык келет, ал эми «кер : азиз» суроодо түшүнүксүз. Ачкычты текшерип алыңыз."},{"n":30,"s":"Нөшөр : сел","o":["Кар : жылгаяк","Ширеңке : от","Жер титирөө","Аптап : кургакчылык"],"k":3,"r":"Себеп : натыйжа","e":"Нөшөр жамгыр сел алып келет. Аптап да кургакчылыкка алып барат. Экөө тең «табигый кубулуш : анын кесепети». Ширеңке : от да себеп-натыйжа, бирок табигый кубулуш эмес.","i":"Булактагы тестте В вариантында экинчи сөз жок (толук эмес)."},{"n":61,"s":"Интернет : роутер","o":["Саат : батарейка","Эшик : ачкыч","Сыналгы : басмак","Мылтык : ок"],"k":0,"r":"Система : аны иштеткен түзүлүш","e":"Интернет роутер аркылуу жеткирилет. Саат батарейка менен иштейт. Экөө тең «система : аны иштеткен түзүлүш»."}],[{"n":19,"s":"Аңгеме : кыска","o":["Эпос : көлөмдүү","Жомок : кызыктуу","Биография : узун","Ыр : уккулуктуу"],"k":0,"r":"Жанр : анын мүнөздүү белгиси","e":"Аңгеме көлөмү кичине (кыска) чыгарма. Эпос көлөмү чоң (көлөмдүү) чыгарма. «Жанр : анын негизги белгиси» ушул. Жомок : кызыктуу жана ыр : уккулуктуу жеке баа, жанрды аныктоочу белги эмес."},{"n":35,"s":"Асман : обо","o":["Топурак : жер","Батир : үй","Желек : асаба","Даанышман : чечен"],"k":2,"r":"Түшүнүк : ага байланыштуу нерсе","e":"Ачкыч боюнча туура жооп В (желек : асаба): желек асабага илинет.","w":"«Асман : обо» деген башкы жуптун мааниси так эмес, ошондуктан толук логикалык түшүндүрмө берүү кыйын. Түп нускадан текшерип алыңыз."},{"n":36,"s":"Учак : аэропорт","o":["Унаа : гараж","Поезд : метро","Ат араба : короо","Кеме : порт"],"k":3,"r":"Транспорт : ал токтоочу бекет","e":"Учак аэропортко конот, кеме портко токтойт. Экөө тең «транспорт : анын бекети». Унаа : гараж сактоочу жер, поезд : метро ар башка транспорт, ат араба : короо мал турак жайы."},{"n":12,"s":"Кежир : тил албас","o":["Жоош : момун","Урушчаак : сабырдуу","Жалганчы : бетпак","Элпек : шамдагай"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Кежир тил албас, өжөр дегенди билдирет. Элпек менен шамдагай да бирдей маанидеги сөздөр. Урушчаак менен сабырдуу карама-каршы, ал эми жалганчы менен бетпак байланышсыз.","i":"«Жоош : момун» да синоним, ошондуктан бул суроодо эки вариант жакын. Ачкыч боюнча Г."},{"n":44,"s":"Учак : канат","o":["Шайтан араба : дөңгөлөк","Телефон : энергия","Камаз : жүк","От араба : от"],"k":0,"r":"Транспорт : аны кыймылдатуучу бөлүк","e":"Учак канаттын жардамы менен учат. Шайтан араба дөңгөлөк менен жүрөт. Экөө тең «транспорт : аны жылдырган негизги бөлүк». Телефон : энергия, камаз : жүк, от араба : от башка байланыштар."},{"n":10,"s":"Үч бурчтук : фигура","o":["Мебель : жыгач","Китеп : кагаз","Бугу : уруу","Өсүмдүк : биология"],"k":2,"r":"Жеке түр : анын жалпы тобу","e":"Үч бурчтук фигуралардын бир түрү. Бугу да кыргыз урууларынын бири. Экөө тең «жеке түр : анын жалпы тобу». Мебель : жыгач, китеп : кагаз буюм менен материал, ал эми өсүмдүк : биология объект менен илим."},{"n":97,"s":"Саат : убакыт","o":["Термометр : жылуулук","Секундомер : тездик","Компас : багыт","Тараза : салмак"],"k":2,"r":"Прибор : ал көрсөткөн нерсе","e":"Саат убакытты көрсөтөт. Компас багытты көрсөтөт. Экөө тең «прибор : ал көрсөткөн нерсе». Секундомер тездикти эмес, убакытты өлчөйт.","i":"А жана Г да ушундай жүйөгө ылайык. Ачкыч боюнча туура жооп В."},{"n":49,"s":"Казан : кулак","o":["Эшик : тутка","Самоор : чорго","Бут кийим : боо","Шым : чентек"],"k":0,"r":"Буюм : аны кармоочу бөлүк","e":"Казанды кулагынан кармайбыз. Эшикти туткасынан кармайбыз. Экөө тең «буюм : аны кармоочу бөлүк». Самоор : чорго, бут кийим : боо, шым : чентек кармагыч эмес."},{"n":46,"s":"Жел : шамал","o":["Чачык : баш аламан","Келчүк : океан","Таш : аска","Шүүдүрүм : бубак"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Жел менен шамал бир кубулуштун эки аталышы. Шүүдүрүм менен бубак да маанилеш сөздөр катары берилген. Калган варианттар башка байланыштарда."},{"n":45,"s":"Оюн : көк бөрү","o":["Оюн : футбол","Оюн : теннис","Оюн : топ таш","Оюн : ордо"],"k":0,"r":"Оюн : оюндун түрү","e":"Ачкыч боюнча туура жооп А. Көк бөрү менен футбол командалык оюндар.","w":"«Топ таш» же «ордо» да улуттук оюндар. Ачкыч А дейт, бирок бул суроонун логикасы так эмес. Текшерип алыңыз."},{"n":33,"s":"Ийне : темене","o":["Аш айры : айры","Күзгү : тарак","Балка : балта","Повесть : поэма"],"k":0,"r":"Окшош түзүлүштөгү куралдар","e":"Ийне менен темене эки учу так, тешүүчү куралдар. Аш айры менен айры да бир түрдөгү курал (кичинеси жана чоңу). Күзгү : тарак жана повесть : поэма башка топтор.","i":"«Балка : балта» да эки курал, ошондуктан бул суроо толук ачык эмес. Ачкыч боюнча туура жооп А."},{"n":51,"s":"Декан : университет","o":["Мугалим : мектеп","Администрация : ресторан","Башкы врач : оорукана","Официант : кафе"],"k":1,"r":"Жетекчи : мекеме","e":"Ачкыч боюнча туура жооп Б.","w":"Декан университеттин (факультеттин) жетекчиси, ошондуктан «башкы врач : оорукана» (жетекчи : мекеме) логикага жакыныраак көрүнөт. Ачкыч Б дейт, текшерип алыңыз."},{"n":27,"s":"Жарык : фотосинтез","o":["Азык : энергия","Тоют : мал","Шекер : диабет","Элемент : реакция"],"k":0,"r":"Булак : андан келип чыккан процесс","e":"Фотосинтез жарыктан башталат, жарык анын энергия булагы. Азык да энергия берет, «булак : андан чыккан натыйжа». Калган варианттарда булактын жыйынтыгы ушундай эмес."},{"n":99,"s":"Каакым : өсүмдүк","o":["Алма : жемиш","Осётр : балык","Кайың : бак","Буркут : жаныбар"],"k":3,"r":"Өкүл : ири дүйнө","e":"Каакым өсүмдүктөр дүйнөсүнүн өкүлү. Буркут жаныбарлар дүйнөсүнүн өкүлү. Калган варианттарда экинчи сөз кичирээк топ (жемиш, балык, бак)."},{"n":87,"s":"Кыял : иш-аракет","o":["Жалкоолук : мээнеткечтик","Максат : эмгек","Сүйүү : симпатия","Тилек : бата"],"k":3,"r":"Ой : ага жооп/кийинки кадам","e":"Ачкыч боюнча туура жооп Г (тилек : бата).","w":"«Максат : эмгек» (ой : анын аткарылышы) логикага жакыныраак көрүнөт. Ачкыч Г дейт, текшерип алыңыз."},{"n":2,"s":"Фонетика : тыбыш","o":["Фразеологизм : сөз айкашы","Макал-лакап : сөз","Текст : сүйлөм","Пунктуация : тыныш белги"],"k":3,"r":"Илим : ал үйрөнгөн объект","e":"Фонетика тыбыштарды үйрөнөт. Пунктуация да тыныш белгилерди үйрөнөт. Экөө тең «тил илиминин бөлүмү : анын изилдөө объектиси». Калган үч вариантта биринчи сөз илим эмес, алар тилдин бирдиктери (фразеологизм, макал-лакап, текст)."},{"n":58,"s":"Жарыш : эрегишүү","o":["Тамак : тоюу","Ооруу : азап чегүү","Университет : билүү","Сынак : атаандашуу"],"k":1,"r":"Кубулуш : ага жараша абал","e":"Ачкыч боюнча туура жооп Б (ооруу : азап чегүү).","w":"Жарыш менен эрегишүү маанилеш болгондуктан «сынак : атаандашуу» логикага жакыныраак көрүнөт. Ачкыч Б дейт, текшерип алыңыз."},{"n":13,"s":"Музоо : торпок","o":["Тай : кунан","Күчүк : тайган","Такай : эшек","Ымыркай : өспүрүм"],"k":0,"r":"Жаш мал : ал өскөндөгү кийинки курагы","e":"Музоо өсүп торпок болот, бул жаш малдын кийинки куракка өтүшү. Тай да өсүп кунан болот. Күчүк : тайган вариантында тайган ит тукуму, курак эмес. Ымыркай : өспүрүм адамдын курагы, жаныбар эмес."},{"n":37,"s":"Фортепиано : клавиша","o":["Комуз : тепке","Гитара : кыл","Флейта : аба","Чопо-чоор : тешикче"],"k":2,"r":"Аспап : ага байланыштуу бөлүк","e":"Ачкыч боюнча туура жооп В (флейта : аба): флейтага аба үйлөнөт, ал аркылуу үн чыгат.","w":"«Чопо-чоор : тешикче» же «гитара : кыл» логикага жакыныраак көрүнөт (аспаптын үн чыгарууда колдонулган бөлүгү). Ачкычты текшерип алыңыз."},{"n":15,"s":"Уялчаак : тартынчаак","o":["Намыскей : көк бет","Улуу : барктуу","Билимдүү : сабаттуу","Ийкемдүү : ийменчээк"],"k":2,"r":"Синоним (маанилеш сөздөр)","e":"Уялчаак менен тартынчаак бирдей мааниде. Билимдүү менен сабаттуу да бири-бирине жакын маанидеги сөздөр. Ийкемдүү менен ийменчээк айырмалуу сапаттар, намыскей менен көк бет байланышсыз."}],[{"n":11,"s":"Арал : архипелаг","o":["Дарыя : көл","Толкун : цунами","Жылдыз : топ жылдыз","Планета : галактика"],"k":2,"r":"Жалгыз : топ","e":"Арал бир гана кургак жер бөлүгү, архипелаг аралдардын тобу. Жылдыз да бир гана жылдыз, топ жылдыз жылдыздардын тобу. Дарыя : көл жана толкун : цунами башка байланыштар (бир түр, күчөгөн даража)."},{"n":79,"s":"Вирус : оору","o":["Тамаша : күлүү","Брекет : түздөө","Клей : чаптоо","Дары : сакайтуу"],"k":0,"r":"Себеп : натыйжа","e":"Вирус оору келтирет. Тамаша күлкү келтирет. Экөө тең «себеп : натыйжа»."},{"n":1,"s":"Бут кийим : майлоо","o":["Казан : коолоо","Сакал : алуу","Чаң : сүртүү","Тиш щётка"],"k":0,"r":"Буюм : ага жасалуучу кам көрүү","e":"Алгач байланышты табабыз: бут кийимди жумшартуу жана сактоо үчүн майлайбыз. Демек биринчи сөз буюм, экинчиси ага жасалуучу иш. А вариантында да ошондой: казан да коолонуп (оңдолуп) тейленет. Сакал алуу менен чаң сүртүү башка жүйөгө таандык, ал эми Г вариантында экинчи сөз жок, ошондуктан ал жарабайт."},{"n":31,"s":"Шоколад : таттуу","o":["Палоо : даамдуу","Өрүк : эзилген","Лимон : кычкыл","Сабиз : катуу"],"k":2,"r":"Нерсе : анын негизги даамы","e":"Шоколад таттуу, лимон кычкыл. Экөө тең «нерсе : анын мүнөздүү даамы». Палоо даамдуу деген жалпы сөз, өрүк эзилген абал, ал эми сабиз катуу даам эмес."},{"n":57,"s":"Мугалим : окуучу","o":["Дарыгер : студент","Сатуучу : кардар","Кенчи : мамлекет","Тегирменчи : ун"],"k":1,"r":"Кызмат көрсөтүүчү : аны алуучу","e":"Мугалим окуучуга билим берет. Сатуучу кардарга товар берет. Экөө тең «кызмат көрсөтүүчү : аны алуучу». Дарыгер : студент, кенчи : мамлекет, тегирменчи : ун мындай байланыш эмес."},{"n":76,"s":"Көз : карек","o":["Сыналгы : экран","Алакан : манжа","Белме : терезе","Пульт : батарея"],"k":0,"r":"Бүтүн : анын негизги бөлүгү","e":"Көздүн негизги бөлүгү карек. Сыналгынын негизги бөлүгү экран. «Бүтүн : анын негизги бөлүгү»."},{"n":63,"s":"Балык : икра","o":["Бугу : сүт","Бака : көнөкбаш","Ит : күчүк","Тоок : жумуртка"],"k":3,"r":"Жаныбар : анын тукум башталышы","e":"Балык икра таштайт. Тоок жумуртка тууйт. Экөө тең «жаныбар : андан чыккан тукум башталышы»."},{"n":71,"s":"Кымыз : чанач","o":["Буудай : кампа","Суу : чыны","Кын : кылыч","Тамак-аш : муздаткыч"],"k":0,"r":"Продукт : аны сактоочу идиш","e":"Кымыз чанач менен сакталат. Буудай кампада сакталат. Экөө тең «продукт : аны сактоочу идиш/жай»."},{"n":74,"s":"Библиофил : китеп","o":["Коллекционер : раритет","Машинист : унаа","Альтруист : эл","Нумизмат : тыйын"],"k":3,"r":"Сүйүүчү : анын объектиси","e":"Библиофил китеп жыйнайт. Нумизмат тыйын жыйнайт. Экөө тең «белгилүү нерсени жыйноочу : ал жыйган нерсе». Коллекционер : раритет жалпы түшүнүк."},{"n":54,"s":"Толук : семиз","o":["Алдуу : күчсүз","Аңкоо : манкурт","Серт : түрү суук","Жөнөкөй : жупуну"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Толук менен семиз маанилеш. Жөнөкөй менен жупуну да маанилеш. Алдуу менен күчсүз карама-каршы, ал эми калган варианттар так синоним эмес."},{"n":72,"s":"Уктоо : түш көрүү","o":["Суусоо : чанкоо","Окуу : түшүнүү","Согуу : ыйлоо","Машыгуу : чыңалуу"],"k":3,"r":"Процесс : аны коштогон абал","e":"Уктап жатканда түш көрүлөт. Машыгууда булчуң чыңалат. «Процесс : аны коштогон абал» ушул.","i":"Булактагы Б вариантынын текстиси бузулуп калган эле, «окуу : түшүнүү» деп калыбына келтирилди, ал да окшош көрүнөт. Ачкыч боюнча Г."},{"n":80,"s":"Назик : кыз","o":["Ийкемдүү : аял","Тентек : бала","Барктуу : ата","Күчтүү : эркек"],"k":3,"r":"Мүнөздүү сапат : ага ээ жан","e":"Назиктик кыз балага мүнөздүү. Күчтүүлүк эркекке мүнөздүү. «Сапат : ага мүнөздүү жан» ушул."},{"n":77,"s":"Кулпунай : кыям","o":["Дан : нан","Сүт : айран","Эт : бешбармак","Алма : шире"],"k":3,"r":"Жемиш : андан жасалган азык","e":"Кулпунайдан кыям жасалат. Алмадан шире жасалат. Экөө тең «жемиш : андан жасалган азык». Калган варианттарда биринчи сөз жемиш эмес."},{"n":29,"s":"Иске : жыпар","o":["Эшит : мукам","Байка : асыл","Сез : той","Өкүр : өлүм"],"k":0,"r":"Сезүү аракети : анын объектиси","e":"Иске дегени жыпарды (жыт) сезүү. Эшитүү да мукамды сезүү аракети. Калган варианттарда сезүү аракети менен анын объектиси жок."},{"n":14,"s":"Мектеп : дарскана","o":["Мугалим : окутуучу","Кесе : чейчек","Асел : бал","Алтын : дилде"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Мектеп менен дарскана бир нерсени билдирген эки сөз. Алтын менен дилде да ушундай жуп. Ачкыч боюнча туура жооп Г.","i":"А, Б, В варианттары да синоним болуп көрүнөт, ошондуктан бул суроону түп нускадан текшерип алган жакшы."},{"n":83,"s":"Суроо : жооп","o":["Салам : алик","Аракет : максат","Коштошуу : учурашуу","Эрдик : алкыш"],"k":0,"r":"Чакыруу : ага жооп","e":"Суроого жооп берилет. Саламга алик алынат. Экөө тең «чакыруу : ага жооп»."},{"n":66,"s":"Сынуу : чың","o":["Оңолуу : бузук","Күйүү : ным","Жийиркенүү : жагымдуу","Тоңуу : суюк"],"k":1,"r":"Аракет : ага каршы турган абал","e":"Чың нерсе оңой сынбайт. Нымдуу нерсе күйбөйт. Экөө тең «процесске каршы турган сапат»."},{"n":65,"s":"Көк : чөп","o":["Ак : сүт","Жарык : ай","Жалын : от","Ийгилик : бакыт"],"k":0,"r":"Түс : ал түстөгү нерсе","e":"Көк чөп көк түстө. Ак сүт ак түстө. «Түс : аны мүнөздөгөн нерсе». Калган варианттарда биринчи сөз түс эмес.","t":"Булактагы «чеп» сөзү «чөп» деп оңдолду."},{"n":41,"s":"Калем : жазуу","o":["Карандаш : уучтоо","Дептер : чийүү","Бор : жазуу","Китеп : жаратуу"],"k":1,"r":"Курал : анын иши","e":"Ачкыч боюнча туура жооп Б (дептер : чийүү).","w":"«Бор : жазуу» калем : жазуу деген байланышка эң жакын көрүнөт. Ачкыч Б дейт, текшерип алыңыз."},{"n":16,"s":"Дарыя : Нил","o":["Тоо : Эверест","Жаныбар : кит","Имарат : Бурдж-Калифа","Океан : Инд океаны"],"k":0,"r":"Категория : анын эң белгилүү өкүлү","e":"Нил дарыялардын ичинен эң белгилүү жана эң узуну. Эверест тоолордун ичинен эң бийиги. Ошентип «категория : анын эң белгилүү өкүлү». Инд океаны океандардын ичинен эң чоңу эмес, ошондуктан Г туура эмес.","i":"«Жаныбар : кит» жана «имарат : Бурдж-Калифа» да ушундай логикага жакын. Ачкыч боюнча туура жооп А."}],[{"n":233,"s":"Тил : тиш","o":["Аталык : энелик","Манжа : туяк","Роза : ландыш","Китеп : дептер"],"k":0,"r":"Түшүнүк","e":"Бул суроо тилге байланыштуу жуптарды салыштырат.","i":"Ачкыч боюнча А."},{"n":178,"s":"Алхимия : сыйкыр","o":["Футурология : келечек","Астрология : тагдыр","Синоптика : аба ырайы","Лингвистика : тил"],"k":1,"r":"Жалган илим : ал айткан нерсе","e":"Алхимия сыйкырга таянат, астрология тагдырды айтат. Экөө тең илим эмес, ишенимге негизделген."},{"n":104,"s":"Нан : жабу","o":["Фильм : тартуу","Китеп : окуу","Дасторкон : жаюу","Темир : эритүү"],"k":0,"r":"Өндүрүлгөн нерсе : аны жасоо иши","e":"Нан жабылат (бышырылат), фильм тартылат. Экинчи сөз биринчи нерсени жаратуучу иш. Дасторкон менен темирде андай эмес: аларды жаюу же эритүү жаратуу эмес, жөн гана иш-аракет."},{"n":119,"s":"Тарых : археология","o":["География : экономика","Тил : лингвистика","Алгебра : геометрия","Химия : биология"],"k":1,"r":"Түшүнүк : аны үйрөнгөн илим","e":"Тарыхты археология үйрөнөт, тилди лингвистика үйрөнөт. Экинчи сөз биринчи сөздүн илимий багыты."},{"n":182,"s":"Согуш : жеңиш","o":["Мелдеш : жеңүү","Талаш : тартыш","Уруш : чатак","Таймаш : утуш"],"k":3,"r":"Мелдеш : анын жыйынтыгы","e":"Согуштан жеңиш чыгат. Таймаштан утуш чыгат. Экинчи сөз биринчи иштин максаты."},{"n":146,"s":"Шыпыруу : таза","o":["Боёо : түстүү","Жүгүрүү : бат","Иштөө : бай","Жасануу : сулуу"],"k":0,"r":"Иш-аракет : анын натыйжасы","e":"Шыпырсаң таза болот. Бояса түстүү болот. Экинчи сөз ишти аткаргандан кийинки абал."},{"n":189,"s":"Тоо : бийик","o":["Имарат : бийик","Жылан : бийик","Үн : бийик","Хан : бийик"],"k":0,"r":"Объект : анын сапаты","e":"Тоо бийик. Имарат бийик. Экөө тең бийиктик менен мүнөздөлөт."},{"n":202,"s":"Бычак : кесүү","o":["Балта : жаруу","Кумган : толтуруу","Саат : көрсөтүү","Дептер : жазуу"],"k":0,"r":"Курал : анын иши","e":"Бычак кесет. Балта жарат. Экинчи сөз куралдын аткарган иши."},{"n":118,"s":"Терең : тайыз","o":["Чыгыш : батыш","Кооз : серт","Берешен : март","Татаал : жөнөкөй"],"k":3,"r":"Антоним","e":"Терең менен тайыз тескери маанилүү. Татаал менен жөнөкөй да тескери маанилүү. Сын атоочтор бири-бирине карама-каршы.","i":"Чыгыш менен батыш да каршы, бирок алар зат атооч. Ачкыч боюнча Г."},{"n":143,"s":"Унаа : дөңгөлөк","o":["Унаа : эшик","Унаа : руль","Унаа : салон","Унаа : фара"],"k":1,"r":"Бүтүн : анын негизги бөлүгү","e":"Унаанын жүрүшүн камсыз кылган негизги бөлүк дөңгөлөк. Рулсуз да унаа башкарылбайт. Эшик, салон, фара кошумча бөлүктөр.","w":"Суроодогу баары унаанын бөлүгү, ошондуктан так бир гана логика жок. Ачкыч боюнча туура жооп Б."},{"n":179,"s":"Төө : өркөч","o":["Адам : акыл","Куш : канат","Пил : мурун","Кой : туяк"],"k":2,"r":"Жаныбар : анын айырмалоочу белгиси","e":"Төөнү өркөчү айырмалайт. Пилди мурну айырмалайт. Экөө тең жаныбардын эң белгилүү өзгөчөлүгү."},{"n":209,"s":"Обо : көк","o":["Темир : ийилгис","От : жалын","Пешене : маңдай","Жол : багыт"],"k":2,"r":"Байланыш","e":"Обо көккө байланган салт. Пешене маңдайга байланган түшүнүк.","i":"Салттуу ишенимге байланыштуу суроо. Ачкыч боюнча В."},{"n":185,"s":"Жумуртка : тукум","o":["Тамак : оокат","Арык : дарыя","Чөйчөк : чыны","Адам : инсан"],"k":0,"r":"Синоним","e":"Тамак менен оокат маанилеш. Жумуртка менен тукум да ушундай маанидеш деп алынган."},{"n":207,"s":"Күрө : күрөк","o":["Кес : кесинди","Каз : казык","Теп : тепкич","Тырма : тырмоок"],"k":3,"r":"Иш : курал","e":"Күрөөдөн күрөк, тырмоодон тырмоок жасалат. Экинчи сөз биринчи ишти аткарган курал."},{"n":171,"s":"Кемсинтүү : маанай","o":["Алдоо : көз караш","Тажатуу : сабыр","Согуу : дене","Урушуу : көңүл"],"k":3,"r":"Иш-аракет : ал бузган нерсе","e":"Кемсинтүү маанайды бузат. Урушуу көңүлдү оорутат. Экинчи сөз иш-аракеттен жабыркаган нерсе."},{"n":161,"s":"Дасторкон : стол","o":["Кийим : адам","Мукаба : китеп","Кабык : алма","Палас : пол"],"k":3,"r":"Жабуу : ал жабылган бет","e":"Дасторкон столдун үстүн жабат. Палас полдун үстүн жабат. Экинчи сөз биринчи нерсе жабылган бет."},{"n":190,"s":"Трактор : агрономия","o":["Учак : пилотаж","Барометр : физиономия","Телескоп : астрономия","Автобус : коммуникация"],"k":2,"r":"Курал : илим","e":"Телескоп менен астрономияны үйрөнөбүз. Трактор менен агрономияда иштейбиз."},{"n":204,"s":"Үтүк : ысык","o":["Суу : жылуу","Казан : чуңкур","Аба : салкын","Муздаткыч : муздак"],"k":3,"r":"Түзмөк : ал берген сапат","e":"Үтүк ысык болот. Муздаткыч муздак болот. Экинчи сөз түзмөк берген сапат."},{"n":193,"s":"Вена : кан","o":["Ооз : аш","Жалбырак : аба","Коко : суюктук","Тамыр : суу"],"k":3,"r":"Түтүк : ага агуучу нерсе","e":"Веналар аркылуу кан агат. Өсүмдүк тамыры аркылуу суу агат."},{"n":205,"s":"Сан : арип","o":["Пьеса : драма","Улут : калк","Проза : поэзия","Автор : жазуучу"],"k":2,"r":"Эки түрү","e":"Сан менен арип экөө тең жазуу белгиси. Проза менен поэзия адабияттын эки түрү."}],[{"n":227,"s":"Турна : жаз","o":["Көк : жаз","Карга : жаз","Кар : жаз","Салкын : жаз"],"k":0,"r":"Белги : мезгил","e":"Турна жазда келет. Көк жазда чыгат. Экөө тең жазды билдирген белги."},{"n":141,"s":"Жуунуу : мончо","o":["Сүзүү : көл","Уктоо : үй","Сугаруу : арык","Сыйынуу : мечит"],"k":3,"r":"Иш-аракет : ал аткарылуучу жай","e":"Мончодо жуунат. Мечитте сыйынат. Экөө тең иш-аракет жана анын өзүнө таандык жайы."},{"n":107,"s":"Билерик : билек","o":["Көз айнек : көз","Бут кийим : бут","Шакек : кол","Сырга : кулак"],"k":3,"r":"Жасалга : ал тагылган дене мүчөсү","e":"Билерик билекке тагылат, сырга кулакка тагылат. Экөө тең жасалга жана ал тагылуучу так мүчө. Шакек колго эмес, манжага кийилет, ошондуктан так эмес.","w":"Булакта бул суроонун эки ачкычы бар: бир жерде В, башка жерде Г. Логика боюнча Г (сырга : кулак) так, ошондуктан Г тандалды."},{"n":168,"s":"Жигит : бозой","o":["Карыя : ата","Бала : тун","Кыз : селки","Күйөө : жолдош"],"k":2,"r":"Жаш адам : ага таандык оюн","e":"Жигиттин оюну бозой, кыздын оюну селки. Экөө тең жаштардын салттуу оюну.","i":"Бул суроо элдик оюндарга байланыштуу, ачкыч боюнча В."},{"n":195,"s":"Целлофан : баштык","o":["Айнек : идиш","Нефть : асфальт","Чырак : лампа","Суу : бассейн"],"k":0,"r":"Материал : продукт","e":"Целлофандан баштык жасалат. Айнектен идиш жасалат."},{"n":187,"s":"Кой : эт","o":["Кой : шыйрак","Кой : устукан","Кой : козу","Кой : жүн"],"k":3,"r":"Жаныбар : андан алынган продукт","e":"Койдон эт, жүн алабыз. Жүн койдун продуктусу. Башка варианттарда мүчөлөр менен балдар берилген."},{"n":222,"s":"Ат : псевдоним","o":["Инсан : аноним","Чындык : калп","Фамилия : отчество","Паспорт : күбөлүк"],"k":0,"r":"Атоо","e":"Ат менен псевдоним ысымдар. Инсан менен аноним ысымы жок адам."},{"n":208,"s":"Сурануу : жалынуу","o":["Үн көтөрүү : урушуу","Эскертүү : жазалоо","Сабоо : согуу","Көз жумуу : өлүү"],"k":0,"r":"Даража","e":"Сурануу күчөсө жалынуу болот. Үн көтөрүү күчөсө уруш болот. Экинчи сөз биринчисинин күчөгөн түрү."},{"n":117,"s":"Фобия : коркуу","o":["Манипуляция : башкаруу","Хобби : машыгуу","Коллекция : чогултуу","Филия : жакшы көрүү"],"k":3,"r":"Түшүнүк : анын тартылуу багыты","e":"Фобия белгилүү нерседен ашкере коркуу. Филия белгилүү нерсеге ашкере тартылуу, жакшы көрүү. Экөө тең бир эле өңүттөгү каршы түшүнүктөр.","w":"Булакта эки ачкыч бар: В жана Г. Фобия менен филия бир үлгүдө түзүлгөн (корку : жакшы көрүү), ошондуктан Г тандалды."},{"n":188,"s":"Падыша : вазир","o":["Эркек : аял","Президент : премьер-министр","Ата : уул","Устат : шакирт"],"k":1,"r":"Башчы : анын жардамчысы","e":"Падышага вазир кызмат кылат. Президентке премьер-министр кызмат кылат."},{"n":211,"s":"Маляр : сырдоо","o":["Окуучу : окуу","Профессор : сүйлөө","Механик : оңдоо","Кардар : тейлөө"],"k":2,"r":"Адис : анын иши","e":"Маляр сырдайт. Механик оңдойт."},{"n":162,"s":"Шыктуу : таланттуу","o":["Билимдүү : интелигенттүү","Күчтүү : эр жүрөк","Сыйлуу : авторитеттүү","Сөзгө бекем : оратор"],"k":0,"r":"Синоним","e":"Шыктуу менен таланттуу маанилеш. Билимдүү менен интелигенттүү да маанилеш.","i":"«Сыйлуу : авторитеттүү» да маанилеш, ачкыч боюнча А."},{"n":198,"s":"Шаң : кайгы","o":["Кубаныч : муң","Күлкү : ый","Карылык : жаштык","Ийгилик : өкүнүч"],"k":0,"r":"Антоним","e":"Шаң менен кайгы тескери. Кубаныч менен муң да тескери."},{"n":177,"s":"Жалын : от","o":["Сел : суу","Жер титирөө : жер","Куюн : шамал","Толкун : көл"],"k":0,"r":"Табигый күч : анын күчтүү түрү","e":"Жалын оттун күчтүү түрү. Сел суунун күчтүү түрү. Экинчи сөз биринчи нерсенин жөнөкөй түрү."},{"n":215,"s":"Идирек : зээндүү","o":["Толук : арык","Күчтүү : бышык","Татаал : жөнөкөй","Март : берешен"],"k":3,"r":"Синоним","e":"Идирек менен зээндүү маанилеш. Март менен берешен да маанилеш."},{"n":101,"s":"Материк : Евразия","o":["Өлкө : Ватикан","Чөл : Сахара","Жаныбар : кит","Океан : Тынч"],"k":3,"r":"Түшүнүк : анын эң чоң өкүлү","e":"Евразия материктердин эң чоңу. Тынч океан да океандардын эң чоңу. Демек экинчи сөз биринчи сөздүн ичиндеги эң ири өкүл.","i":"Сахара да чөлдөрдүн чоңдорунан, бирок өзүнчө эң чоңу эмес (бул жерде Антарктида чөлү андан чоң). Ачкыч боюнча туура жооп Г."},{"n":221,"s":"Жылымык : жылуу","o":["Муздак : тоңгон","Көгүлтүр : көк","Чоң : зор","Кызыл : кочкул кызыл"],"k":1,"r":"Даража","e":"Жылымык жуушаак жылуу. Көгүлтүр ачык көк."},{"n":137,"s":"Тарбия : ата-эне","o":["Окутуу : мугалим","Жүрүм-турум : тарбиячы","Билим : педагог","Мүнөз : психолог"],"k":2,"r":"Түшүнүк : аны берүүчү адам","e":"Тарбияны ата-эне берет. Билимди педагог берет. Экөө тең абстракттуу түшүнүк жана аны жеткирүүчү адам.","i":"«Окутуу : мугалим» да жакын, бирок ал иш-аракет менен ишмер, ал эми суроодо түшүнүк менен берүүчү адам. Ачкыч боюнча В."},{"n":214,"s":"Босого : астана","o":["Отун : жыгач","Тоголок : тегерек","Жээк : кылаа","Эшик : тутка"],"k":2,"r":"Синоним","e":"Босого менен астана маанилеш. Жээк менен кылаа да маанилеш."},{"n":173,"s":"Көрчычкан : ийин","o":["Ит : кепе","Адам : үй","Кумурска : уюк","Үкү : уя"],"k":2,"r":"Жаныбар : анын уясы","e":"Көрчычкандын ийини бар. Кумурсканын уюгу бар. Экинчи сөз жаныбардын уясы."}],[{"n":201,"s":"Кум : айнек","o":["Күмүш : шакек","Таш : аки","Сүт : курут","Суу : буу"],"k":2,"r":"Чийки зат : продукт","e":"Кумдан айнек жасалат. Сүттөн курут жасалат. Экинчи сөз биринчи материалдан жасалган нерсе."},{"n":236,"s":"Каруу : дарман","o":["Эр жүрөк : ак жүрөк","Оомат : бийлик","Мансап : байлык","Наздануу : кылык"],"k":1,"r":"Синоним","e":"Каруу менен дарман маанилеш. Оомат менен бийлик да маанилеш."},{"n":181,"s":"Алма : өсүмдүк","o":["Славян : улут","Курт : жаныбар","Бактерия : паразит","Китеп : окуу куралы"],"k":1,"r":"Түрү : анын тобу","e":"Алма өсүмдүктүн бир түрү. Курт жаныбарлардын бир түрү. Экинчи сөз биринчи сөздүн жалпы тобу."},{"n":106,"s":"Адам : оору","o":["Темир : дат","Алма : курт","Жыгач : чиринди","Ит : кутургу"],"k":3,"r":"Тирүү жан : ага тийген оору","e":"Адам оорууга чалдырат, ит кутургуга чалдырат. Экөө тең тирүү жандык жана анын оорусу. Темирдин датынан айырмасы: ит тирүү, ал эми дат оору эмес, метал бузулушу.","i":"Булактын экинчи ачкычында А (темир : дат) деп да турат. Бирок «оору» тирүү жандыкка тиешелүү, ошондуктан Г тандалды."},{"n":158,"s":"Табит : тамактануу","o":["Маанай : кубануу","Көңүл : аткаруу","Аракет : жасоо","Мүмкүнчүлүк : эс алуу"],"k":2,"r":"Жөндөм : иш","e":"Табит тамактанууга түрткү берет. Аракет жасоого түрткү берет. Экинчи сөз биринчи сөздөн кийинки иш."},{"n":172,"s":"Учкуч : учак","o":["Капитан : кеме","Окумуштуу : лаборатория","Доктор : оорукана","Официант : ресторан"],"k":2,"r":"Адис : ал башкарган нерсе","e":"Учкуч учакты башкарат. Ушул логика боюнча капитан кемени башкарат.","w":"Ачкыч боюнча В (доктор : оорукана), бирок доктор оорукананы башкарбайт. Логика боюнча А (капитан : кеме) туура көрүнөт."},{"n":231,"s":"Бокс : раунд","o":["Теннис : аут","Көк бөрү : упай","Футбол : тайм","Күрөш : таймаш"],"k":2,"r":"Оюн : анын бөлүгү","e":"Боксто раунд бар, футболда тайм бар. Экинчи сөз оюндун убакыт бөлүгү."},{"n":153,"s":"Сүмөлөк : Нооруз","o":["Блин : Масленица","Балаты : Жаңы жыл","Торт : туулган күн","Плов : Курман айт"],"k":0,"r":"Майрам : анын салттуу тамагы","e":"Нооруз майрамында сүмөлөк бышат. Масленицада блин бышат. Экөө тең майрам жана анын белгилүү тамагы."},{"n":135,"s":"Манты : оромо","o":["Арпа : таруу","Жарма : сүмөлөк","Калпак : белдемчи","Карагай : терек"],"k":0,"r":"Окшош бир түрдөгү экөө","e":"Манты менен оромо экөө тең камырдан бышкан тамак. Арпа менен таруу да экөө тең дан өсүмдүгү. Биринчи жуп да, жооп да бир топтогу окшош нерселер.","i":"Бул суроонун ачкычы тамактар менен дандарды окшоштурат. Ачкыч боюнча туура жооп А."},{"n":225,"s":"Регби : англичан","o":["Сумо : жапон","Футбол : испанец","Фехтование : немец","Көк-бөрү : кыргыз"],"k":3,"r":"Оюн : ал таандык улут","e":"Регби англичандардын оюну. Көк бөрү кыргыздардын оюну."},{"n":103,"s":"Согуш : багындыруу","o":["Жеңиш : жашоо","Көтөрүлүш : эркин болуу","Мелдеш : элдешүү","Тынчтык : өмүр сүрүү"],"k":1,"r":"Окуя : анын максаты","e":"Согуштун максаты башкаларды багындыруу. Көтөрүлүштүн максаты эркин болуу. Экинчи сөз биринчи сөздүн эмне үчүн болоорун көрсөтөт."},{"n":240,"s":"Сөгүү : капалуу","o":["Мактоо : көңүлдүү","Урушуу : таарынычтуу","Сыйлоо : атактуу","Ыйлоо : көңүлсүз"],"k":0,"r":"Иш : кесепет","e":"Сөккөндө капа болот. Мактаганда көңүлдүү болот."},{"n":115,"s":"Дирижёр : оркестр","o":["Инструктор : команда","Мугалим : окуучу","Тренер : футбол","Профессор : студент"],"k":0,"r":"Жетекчи : ал башкарган топ","e":"Дирижёр оркестрди башкарат. Инструктор да команданы башкарат. Мугалим : окуучу жана профессор : студент тарапта шакирт бар, ал топ эмес."},{"n":147,"s":"Банан : маймыл","o":["Эт : ит","Саман : кой","Тоок : түлкү","Козукарын : кирпи"],"k":3,"r":"Жеген : анын тамагы","e":"Банан маймылдын тамагы. Козукарын кирпинин тамагы. Экинчи сөз биринчи сөздү жеген жаныбар.","i":"«Эт : ит» да бул жүйөгө жакын, бирок ачкыч боюнча Г."},{"n":105,"s":"Имарат : каркас","o":["Фигура : форма","Кийим : материал","Боз үй : кереге","Китеп : мукаба"],"k":2,"r":"Бүтүн : анын каркасы","e":"Имараттын негизги каркасы бар. Боз үйдүн каркасы кереге. Экинчи сөз бүтүндүн сөөгүн түзгөн бөлүк."},{"n":142,"s":"Сүйүү : жүрөк","o":["Акыл : мээ","Спорт : штанга","Патриотизм : ураан","Мекен : желек"],"k":3,"r":"Түшүнүк : анын символу","e":"Сүйүүнүн символу жүрөк. Мекендин символу желек. Экөө тең абстракттуу түшүнүк жана анын белгиси."},{"n":210,"s":"Деңиз : көл","o":["Россия : Ватикан","Дөңсөө : тоо","Материк : арал","Аалам : асман"],"k":2,"r":"Чоң : кичине","e":"Деңиз көлдөн чоң. Материк аралдан чоң. Экинчи сөз биринчисинин кичинекей түрү."},{"n":184,"s":"Айнек : терезе","o":["Жыгач : эшик","Алтын : шакек","Цемент : пайдубал","Чопо : чыны"],"k":2,"r":"Материал : андан жасалган нерсе","e":"Айнектен терезе жасалат. Цементтен пайдубал куюлат. Экинчи сөз биринчи материалдан жасалган нерсе.","i":"«Жыгач : эшик» да ушул топко кирет, ачкыч боюнча В."},{"n":218,"s":"Жылан : уулуу","o":["Чөп : уулуу","Жөргөмүш : уулуу","Кескелдирик : уулуу","Игуана : уулуу"],"k":1,"r":"Жаныбар : анын өзгөчөлүгү","e":"Жылан уулуу. Жөргөмүш да уулуу."},{"n":186,"s":"Отун : таарынды","o":["Нан : күкүм","Көмүр : күл","Топурак : баткак","Жыгач : кесинди"],"k":0,"r":"Негизги зат : калдык","e":"Отундан таарынды калат. Нандан күкүм калат. Экинчи сөз биринчи нерсенин калдыгы."}],[{"n":155,"s":"Кошок : өлүм","o":["Ый : өлүм","Кырсык : өлүм","Өкүрүк : өлүм","Жаназа : өлүм"],"k":3,"r":"Өлүм менен байланышкан иш-чара","e":"Кошок менен жаназа экөө тең өлүмгө байланыштуу салт. Экөө тең адам көз жумганда аткарылат."},{"n":191,"s":"Күйөө : кайни","o":["Аял : балдыз","Келин : абысын","Чоң ата : таята","Тайке : жээн"],"k":0,"r":"Тууган : анын тууганы","e":"Күйөөнүн иниси кайни. Аялдын синдиси балдыз. Экөө тең жубайдын жакын тууганы."},{"n":228,"s":"Теология : дин","o":["Биология : өсүмдүк","Нумизматика : китеп","Метеорология : климат","Химия : элемент"],"k":2,"r":"Илим : анын объектиси","e":"Теология динди үйрөнөт. Метеорология климатты үйрөнөт."},{"n":237,"s":"Кинематография : тасма","o":["Адабият : сөз","Архитектура : имарат","Хореография : бий","Медицина : илдет"],"k":2,"r":"Өнөр : анын иши","e":"Кинематография тасма жаратат. Хореография бий жаратат."},{"n":230,"s":"Мүдөө : тилек","o":["Максат : ниет","Дарамет : каражат","Кубаныч : сүйүнчү","Турмуш : махабат"],"k":1,"r":"Синоним","e":"Мүдөө менен тилек маанилеш. Дарамет менен каражат да маанилеш."},{"n":150,"s":"Эркин : азат","o":["Ачуу : кычкыл","Сулуу : назик","Соо : аман","Сабырдуу : ыймандуу"],"k":2,"r":"Синоним","e":"Эркин менен азат маанилеш. Соо менен аман да маанилеш."},{"n":224,"s":"Токтом : документ","o":["Сүт : азык","Мал : жылкы","Жамгыр : аба ырайы","Тик учак : транспорт"],"k":3,"r":"Жеке : жалпы","e":"Токтом документтин бир түрү. Тик учак транспорттун бир түрү."},{"n":112,"s":"Сызгыч : сантиметр","o":["Тараза : масса","Компас : багыт","Градусник : градус","Саат : минута"],"k":3,"r":"Өлчөөчү курал : өлчөө бирдиги","e":"Сызгыч сантиметр менен өлчөйт. Саат минута менен өлчөйт. Экинчи сөз каралган куралдын бирдиги.","w":"«Градусник : градус» да так ушул жүйө менен түзүлгөн, ошондуктан В да туура көрүнөт. Ачкыч боюнча Г."},{"n":165,"s":"Гитара : комуз","o":["Флейта : ооз комуз","Аккордеон : фортепиано","Скрипка : кыл кыяк","Барабан : чоор"],"k":2,"r":"Аналог аспап","e":"Гитара менен комуз кылдуу аспаптар, экөө тең тартылат. Скрипка менен кыл кыяк да кылдуу аспаптар."},{"n":169,"s":"Литр : миллилитр","o":["Китеп : бет","Грамм : килограмм","Ай : апта","Сутка : күн"],"k":0,"r":"Бүтүн : анын бөлүгү","e":"Литр миллилитрден турат, китеп беттерден турат. Экинчи сөз бүтүндүн майда бөлүгү."},{"n":223,"s":"Уук : кереге","o":["Шып : чатыр","Гүл : өсүмдүк","Кашык : аяк","Кийим : баштык"],"k":0,"r":"Бөлүк : анын жери","e":"Уук менен кереге боз үйдүн бөлүктөрү. Шып менен чатыр да имараттын бөлүктөрү."},{"n":113,"s":"Узун : акыра","o":["Бийик : небоскрёб","Каардуу : арстан","Ээн : талаа","Кымбат : алтын"],"k":0,"r":"Сапат : анын эң күчтүү көрүнүшү","e":"Бийик нерсенин эң чоң мисалы небоскрёб. Узундуктун чеги дагы ушундай. Экинчи сөз биринчи сапаттын эң күчтүү мисалы."},{"n":183,"s":"Бөкөнбаев : драматург","o":["Пушкин : жазуучу","Айтиев : артист","Ахматова : поэтесса","Осмонов : ойчул"],"k":2,"r":"Адам : анын кесиби","e":"Ахматова — акын, Бөкөнбаев — драматург. Экөө тең белгилүү адам менен анын кесиби."},{"n":149,"s":"Көсөо : сакалдуу","o":["Барктуу : даңктуу","Калпычы : адилеттүү","Түркөй : билимдүү","Жүдөө : шыктуу"],"k":2,"r":"Антоним","e":"Көсөө менен сакалдуу тескери (сакалы жок / сакалы бар). Түркөй менен билимдүү да тескери. Каршы маанилүү сөз жуптары."},{"n":176,"s":"Бакалоор : мурун","o":["Канат : кол","Жал : чач","Жүн : тери","Туяк : манжа"],"k":1,"r":"Жаныбардын мүчөсү : адамдагы окшошу","e":"Жылкынын жалы адамдын чачына окшош. Бакалоор менен мурун да ушундай. Экөө тең жаныбар менен адамдын бири-бирине окшош мүчөлөрү."},{"n":239,"s":"Машыгуу : булчуң","o":["Жинденүү : нерв","Көрүү : көз","Окуу : мээ","Сүйлөө : ооз"],"k":2,"r":"Машыгуу : өнүккөн мүчө","e":"Машыгуу булчуңду өнүктүрөт. Окуу мээни өнүктүрөт."},{"n":108,"s":"Көгүчкөн : ителги","o":["Жылан : бака","Чөп : кой","Эчки : карышкыр","Акула : кит"],"k":2,"r":"Олжо : жырткыч","e":"Көгүчкөн ителгинин олжосу. Эчки да карышкырдын олжосу. Биринчи сөз жегич эмес, жеген. Башка вариантта тартип тескери: жылан бакага, кой чөпкө."},{"n":140,"s":"Кароо : азиз","o":["Басуу : майып","Тирилүү : өлүк","Тыңшоо : дүлөй","Айыгуу : оорулуу"],"k":2,"r":"Иш-аракет : аны аткара албаган адам","e":"Көрүүнү аткара албаган адам сокур. Тыңшоону аткара албаган адам дүлөй. Экинчи сөз биринчи сезим органынан айрылган адам.","i":"«Басуу : майып» да жакын, бирок майып бир гана басууну эмес, жалпы эле дене мүчөсүн билдирет."},{"n":116,"s":"Сигара : никотин","o":["Баңги : порошок","Арак : спирт","Фаст-фуд : май","Уксус : кислота"],"k":1,"r":"Продукт : анын зыяндуу негизи","e":"Сигарада никотин зыяндуу зат. Араканын негизи спирт. Экөө тең буюмдун курамындагы башкы активдүү зат."},{"n":220,"s":"Терроризм : жардыруу","o":["Кылмыш : өлтүрүү","Сот : чечим чыгаруу","Вандализм : бузуу","Цинизм : баш тартуу"],"k":2,"r":"Көрүнүш : анын иши","e":"Терроризм жардырат. Вандализм бузат. Экинчи сөз биринчи көрүнүштүн мүнөздүү иши."}],[{"n":156,"s":"Чүпүрөк : жоолук","o":["Чыны : кесе","Чөмүч : кашык","Киоск : супермаркет","Барак : дептер"],"k":3,"r":"Түрү : анын жакшыртылган түрү","e":"Чүпүрөктөн жоолук, баракты тигип же бириктирип дептер жасалат. Экинчи сөз биринчи материалдан жасалган даяр нерсе."},{"n":163,"s":"Кубулуш : торнадо","o":["Кубулуш : жамгыр","Кубулуш : цунами","Кубулуш : ызгаар","Кубулуш : аптап"],"k":1,"r":"Түшүнүк : анын коркунучтуу өкүлү","e":"Торнадо, цунами экөө тең жок кылуучу табигый кубулуш. Жамгыр, ызгаар, аптап ошол деңгээлде кыйратуучу эмес."},{"n":238,"s":"Күлазык : майда","o":["Сүт : ак","Алма : ширелүү","Айран : коюу","Эт : даамдуу"],"k":2,"r":"Продукт : анын сапаты","e":"Айран коюу. Күлазык майда."},{"n":206,"s":"Телекөрсөтүү : алып баруу","o":["Транспорт : алып баруу","Сахна : алып баруу","Сабак : алып баруу","Тасма : алып баруу"],"k":1,"r":"Адис : ал алып баруучу иш","e":"Сахнада алып баруучу бар. Телекөрсөтүүдө да алып баруучу бар. Экөө тең иш алып баруучу жай."},{"n":164,"s":"Балмуздак : жай","o":["Жарма : кыш","Өрүк : кеч күз","Байчечекей : эрте жаз","Кымыз : жаз"],"k":2,"r":"Продукт : анын мезгили","e":"Балмуздак жайдын тамагы. Байчечекей эрте жазда чыгат. Экинчи сөз биринчи сөзгө мүнөздүү мезгил."},{"n":174,"s":"Жылуу : жууркан","o":["Таза : самын","Муздак : суу","Жумшак : жер төшөк","Суук : кондиционер"],"k":0,"r":"Сапат : аны камсыздаган нерсе","e":"Жууркан жылуу кылат. Самын таза кылат. Экинчи сөз биринчи сапатты берген нерсе.","i":"«Жумшак : жер төшөк» да жакын, ачкыч боюнча А."},{"n":166,"s":"Кундуз : тебетей","o":["Жибек : материал","Канат : үкү топу","Кылтак : аркан","Кой : чапан"],"k":1,"r":"Жасалга : ага таандык нерсе","e":"Тебетейге кундуз жүнү салынат. Баш кийимге үкү топу тагылат. Экөө тең баш кийимдин жасалгасы катары келет.","i":"Бул суроо элдик каада-салтка байланыштуу, ачкыч боюнча Б."},{"n":144,"s":"Текст : сөз","o":["Сүйлөм : тыбыш","Сөз : үн","Роман : аңгеме","Повесть : жазма"],"k":0,"r":"Бүтүн : анын курамы","e":"Текст сөздөрдөн турат. Сүйлөм тыбыштардан турат. Экөө тең чоң бирдик жана анын курамдык бөлүгү.","i":"Роман аңгемеден түзүлбөйт, ошондуктан В жарабайт."},{"n":226,"s":"Атеизм : дин","o":["Феминизм : эркек","Оппозиция : бийлик","Патриархат : аял","Баптизм : конфессия"],"k":1,"r":"Каршы түшүнүк","e":"Атеизм динге каршы. Оппозиция бийликке каршы."},{"n":216,"s":"Фауна : флора","o":["Проза : поэзия","Оору : дарт","Роза : каакым","Кит : чычкан"],"k":0,"r":"Каршы түшүнүк","e":"Фауна менен флора жупташкан түшүнүктөр. Проза менен поэзия да жупташкан."},{"n":136,"s":"Буулануу : булут","o":["Күйүү : ыш","Тердөө : тери","Жылуулануу : энергия","Эрүү : суу"],"k":3,"r":"Процесс : анын натыйжасы","e":"Буулануудан булут пайда болот. Эрүүдөн суу пайда болот. Экинчи сөз биринчи процесстин натыйжасы."},{"n":145,"s":"Пайдубал : дубал","o":["Арматура : каркас","Шып : чатыр","Тамыр : сабак","Өзөк : гүл"],"k":2,"r":"Негиз : үстүндөгү","e":"Пайдубал дубалды көтөрөт. Тамыр сабакты көтөрөт. Экөө тең төмөнкү негиз жана ага таянган жогорку бөлүк."},{"n":180,"s":"Кайдыгер : альтруист","o":["Билимсиз : интеллект","Күчтүү : арык","Чыдамкай : момун","Жалкоо : иштерман"],"k":3,"r":"Антоним","e":"Кайдыгер менен альтруист тескери. Жалкоо менен иштерман да тескери."},{"n":170,"s":"Чырак : жарык","o":["Батарея : энергия","Түн : караңгы","От : жылуулук","Сыналгы : фильм"],"k":2,"r":"Булак : ал чыгарган нерсе","e":"Чыракты жарык чыгарат. Оттон жылуулук чыгат. Экөө тең булак жана анын берген натыйжасы.","i":"«Батарея : энергия» да ошондой, ачкыч боюнча В."},{"n":213,"s":"Чымыр : көпшөк","o":["Бошоң : чың","Серт : назик","Алп : чоң","Бийик : кыска"],"k":0,"r":"Антоним","e":"Чымыр менен көпшөк тескери. Бошоң менен чың да тескери."},{"n":235,"s":"Адам : олуттуу","o":["Адам : узун","Адам : сүйүктүү","Адам : жакшынакай","Адам : шаңдуу"],"k":3,"r":"Антоним","e":"Олуттуу менен шаңдуу карама-каршы мүнөз."},{"n":212,"s":"Муз : коньки","o":["Талаа : футбол","Көл жээк : катамаран","Суу : сүзүү","Кар : лыжа"],"k":3,"r":"Жер : спорт куралы","e":"Муздун үстүндө коньки тебет. Карда лыжа тебет."},{"n":148,"s":"Даарат : намаз","o":["Жуунуу : тамак","Китеп : мектеп","Билим : кесип","Эмгек : нан"],"k":2,"r":"Даярдык : негизги иш","e":"Намаздан мурун даарат алынат. Кесипке ээ болуу үчүн билим алынат. Экөө тең негизги иштин алдындагы зарыл даярдык."},{"n":109,"s":"Урушуу : таарыныч","o":["Мактоо : сүйүнүч","Жек көрүү : өч","Элдешүү : кечирим","Барктануу : текеберлик"],"k":0,"r":"Иш-аракет : анын кесепети болгон сезим","e":"Урушканда таарыныч пайда болот. Мактаганда сүйүнүч пайда болот. Экөө тең иш-аракет жана анын жараткан сезими.","w":"Булакта экинчи ачкыч А деп жазылган, биринчиси Г. Мактоо : сүйүнүч так себеп-натыйжа, ошондуктан А тандалды."},{"n":154,"s":"Үшүү : тоңуу","o":["Ысуу : тердөө","Күлүү : каткыруу","Калкуу : сүзүү","Урушуу : согуу"],"k":1,"r":"Даража","e":"Үшүү күчөсө тоңуу болот. Күлүү күчөсө каткыруу болот. Экинчи сөз биринчи абалдын күчөгөн түрү."}],[{"n":159,"s":"Гаджет : смартфон","o":["Зер : желбирөөч","Типография : китеп","Эмерек : сыналгы","Короо : каша"],"k":2,"r":"Жалпы : жекече","e":"Гаджет жалпы түшүнүк,
